<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Capacity and code space worksheet</title>
  <desc id="desc">A capacity worksheet for URL creation throughput, redirect throughput, yearly storage, read write ratio, and Base62 namespace sizes.</desc>
  <defs><style>.bg{fill:#fafaf5}.panel{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.dark{fill:#11120f}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.rule{stroke:#c8cbc2;stroke-width:2}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 28px Inter,Arial,sans-serif;fill:#11120f}.big{font:800 43px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 18px Inter,Arial,sans-serif;fill:#11120f}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.mono{font:600 16px ui-monospace,monospace;fill:#11120f}.tw{font:700 18px Inter,Arial,sans-serif;fill:#fafaf5}</style></defs>
  <rect width="1500" height="900" class="bg"/><text class="k" x="55" y="48">CAPACITY WORKSHEET · ASSUMPTIONS, NOT PROPHECY</text>
  <g transform="translate(55 85)"><rect class="panel" width="430" height="310" rx="5"/><text class="h" x="30" y="50">Create traffic</text><text class="big" x="30" y="125">39 RPS</text><text class="s" x="30" y="155">100M links / 30 days</text><line class="rule" x1="30" y1="185" x2="400" y2="185"/><text class="mono" x="30" y="225">peak ≈ 390 RPS</text><text class="s" x="30" y="258">A single relational write authority</text><text class="s" x="30" y="282">still has comfortable headroom.</text></g>
  <g transform="translate(535 85)"><rect class="blue" width="430" height="310" rx="5"/><text class="h" x="30" y="50">Redirect traffic</text><text class="big" x="30" y="125">3,858 RPS</text><text class="s" x="30" y="155">10B redirects / 30 days</text><line x1="30" y1="185" x2="400" y2="185" stroke="#6275b8" stroke-width="2"/><text class="mono" x="30" y="225">peak ≈ 38,580 RPS</text><text class="s" x="30" y="258">Repeated, skewed reads justify cache</text><text class="s" x="30" y="282">and eventually edge distribution.</text></g>
  <g transform="translate(1015 85)"><rect class="lime" width="430" height="310" rx="5"/><text class="h" x="30" y="50">Stored mappings</text><text class="big" x="30" y="125">1.2 TB/year</text><text class="s" x="30" y="155">1.2B links × roughly 1 KB</text><line x1="30" y1="185" x2="400" y2="185" stroke="#9eb43f" stroke-width="2"/><text class="mono" x="30" y="225">+ indexes + replicas + backups</text><text class="s" x="30" y="258">Plan more physical storage, but do</text><text class="s" x="30" y="282">not shard from one estimate alone.</text></g>
  <g transform="translate(55 445)"><rect class="panel" width="1390" height="380" rx="5"/><text class="h" x="30" y="52">Base62 namespace</text><text class="s" x="30" y="82">Digits + lowercase + uppercase. Sequence encoding is collision-free; random selection still needs uniqueness + retry.</text>
    <line x1="245" y1="285" x2="1320" y2="285" stroke="#11120f" stroke-width="3"/>
    <g transform="translate(300 0)"><rect class="dark" x="-3" y="145" width="6" height="140"/><circle class="dark" cy="145" r="10"/><text class="t" y="125" text-anchor="middle">6 chars</text><text class="mono" y="330" text-anchor="middle">56.8B</text></g>
    <g transform="translate(610 0)"><rect class="dark" x="-3" y="120" width="6" height="165"/><circle class="dark" cy="120" r="10"/><text class="t" y="100" text-anchor="middle">7 chars</text><text class="mono" y="330" text-anchor="middle">3.52T</text></g>
    <g transform="translate(920 0)"><rect class="dark" x="-3" y="95" width="6" height="190"/><circle class="dark" cy="95" r="10"/><text class="t" y="75" text-anchor="middle">8 chars</text><text class="mono" y="330" text-anchor="middle">218T</text></g>
    <g transform="translate(1230 0)"><rect class="dark" x="-3" y="70" width="6" height="215"/><circle class="dark" cy="70" r="10"/><text class="t" y="50" text-anchor="middle">9 chars</text><text class="mono" y="330" text-anchor="middle">13.5Q</text></g>
    <rect class="blue" x="30" y="135" width="180" height="100" rx="4"/><text class="tw" x="120" y="174" text-anchor="middle">100:1</text><text class="s" x="120" y="202" text-anchor="middle">read/write ratio</text>
  </g>
</svg>
