<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">URL shortener problem map</title>
  <desc id="desc">A mind map connecting the URL shortener to product behavior, scale, correctness, latency, abuse prevention, and operations.</desc>
  <defs>
    <style>.bg{fill:#fafaf5}.node{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.core{fill:#11120f;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.line{fill:none;stroke:#777a70;stroke-width:2.5}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 27px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 18px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 22px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.sw{font:500 14px Inter,Arial,sans-serif;fill:#c8cbc2}</style>
  </defs>
  <rect width="1500" height="940" class="bg"/>
  <text class="k" x="55" y="48">PROBLEM MAP · THE CONTRACT CREATES THE ARCHITECTURE</text>
  <path class="line" d="M750 470C590 470 565 205 430 205M750 470C585 470 560 465 430 465M750 470C590 470 565 730 430 730M750 470C910 470 935 205 1070 205M750 470C915 470 940 465 1070 465M750 470C910 470 935 730 1070 730"/>
  <g transform="translate(590 375)"><rect class="core" width="320" height="190" rx="10"/><text class="tw" x="160" y="67" text-anchor="middle">URL shortener</text><text class="sw" x="160" y="103" text-anchor="middle">code → destination</text><text class="sw" x="160" y="132" text-anchor="middle">one lookup, many promises</text></g>
  <g transform="translate(70 115)"><rect class="lime" width="360" height="180" rx="6"/><text class="t" x="28" y="43">PRODUCT</text><text class="s" x="28" y="78">generated + custom aliases</text><text class="s" x="28" y="105">expiration · deletion · ownership</text><text class="s" x="28" y="132">editable or immutable destinations?</text><text class="s" x="28" y="159">aggregate click analytics</text></g>
  <g transform="translate(70 375)"><rect class="node" width="360" height="180" rx="6"/><text class="t" x="28" y="43">SCALE</text><text class="s" x="28" y="78">100:1 redirect-to-create ratio</text><text class="s" x="28" y="105">hot links dominate the working set</text><text class="s" x="28" y="132">global latency · regional traffic</text><text class="s" x="28" y="159">storage and namespace growth</text></g>
  <g transform="translate(70 640)"><rect class="blue" width="360" height="180" rx="6"/><text class="t" x="28" y="43">CORRECTNESS</text><text class="s" x="28" y="78">one active destination per code</text><text class="s" x="28" y="105">concurrent custom-alias claims</text><text class="s" x="28" y="132">read-after-create visibility</text><text class="s" x="28" y="159">bounded revocation propagation</text></g>
  <g transform="translate(1070 115)"><rect class="blue" width="360" height="180" rx="6"/><text class="t" x="28" y="43">LATENCY + AVAILABILITY</text><text class="s" x="28" y="78">redirect p99 below 100 ms</text><text class="s" x="28" y="105">99.99% redirect availability</text><text class="s" x="28" y="132">cache hits near the user</text><text class="s" x="28" y="159">analytics never blocks redirect</text></g>
  <g transform="translate(1070 375)"><rect class="lime" width="360" height="180" rx="6"/><text class="t" x="28" y="43">ABUSE + PRIVACY</text><text class="s" x="28" y="78">phishing and malware links</text><text class="s" x="28" y="105">rate limits · reputation checks</text><text class="s" x="28" y="132">fast takedown and audit trail</text><text class="s" x="28" y="159">minimize click-level personal data</text></g>
  <g transform="translate(1070 640)"><rect class="node" width="360" height="180" rx="6"/><text class="t" x="28" y="43">OPERATIONS</text><text class="s" x="28" y="78">cache stampede protection</text><text class="s" x="28" y="105">regional failover · replica lag</text><text class="s" x="28" y="132">SLOs · metrics · traces · logs</text><text class="s" x="28" y="159">backups and disaster recovery</text></g>
</svg>
