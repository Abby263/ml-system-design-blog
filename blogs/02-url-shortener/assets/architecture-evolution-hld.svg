<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc">
  <title id="title">URL shortener architecture evolution</title><desc id="desc">Three stages evolve from one API and PostgreSQL to Redis and separate services, then to edge caching and asynchronous analytics.</desc>
  <defs><style>.bg{fill:#fafaf5}.panel{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.node{fill:#fafaf5;stroke:#11120f;stroke-width:2}.dark{fill:#11120f;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.line{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#a)}.async{fill:none;stroke:#4e62a8;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#b)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 25px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 16px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 16px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}.sw{font:500 13px Inter,Arial,sans-serif;fill:#c8cbc2}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs>
  <rect width="1500" height="1020" class="bg"/><text class="k" x="55" y="46">HIGH-LEVEL DESIGN · EACH BOX MUST EXPLAIN WHY IT EXISTS</text>
  <g transform="translate(55 80)"><rect class="panel" width="645" height="300" rx="5"/><text class="k" x="28" y="40">STAGE 1 · CORRECTNESS</text><text class="h" x="28" y="78">One API + PostgreSQL</text><text class="s" x="28" y="105">Deploy this before solving traffic you do not have.</text><path class="line" d="M160 205H265M395 205H490"/><g transform="translate(55 165)"><rect class="node" width="105" height="80" rx="4"/><text class="t" x="52" y="47" text-anchor="middle">Client</text></g><g transform="translate(265 155)"><rect class="dark" width="130" height="100" rx="4"/><text class="tw" x="65" y="43" text-anchor="middle">API</text><text class="sw" x="65" y="68" text-anchor="middle">create + resolve</text></g><g transform="translate(490 155)"><ellipse class="node" cx="65" cy="13" rx="65" ry="13"/><path class="node" d="M0 13v70c0 7 29 13 65 13s65-6 65-13V13"/><text class="t" x="65" y="57" text-anchor="middle">PostgreSQL</text></g></g>
  <g transform="translate(750 80)"><rect class="panel" width="695" height="300" rx="5"/><text class="k" x="28" y="40">STAGE 2 · READ PRESSURE</text><text class="h" x="28" y="78">Separate scaling + Redis</text><text class="s" x="28" y="105">Redirect replicas scale independently; cache absorbs repeated reads.</text><path class="line" d="M120 205H190M325 165H420M325 245H420M550 165H610M550 245H610"/><g transform="translate(25 165)"><rect class="node" width="95" height="80" rx="4"/><text class="t" x="47" y="47" text-anchor="middle">Client</text></g><g transform="translate(190 125)"><rect class="dark" width="135" height="80" rx="4"/><text class="tw" x="67" y="47" text-anchor="middle">Create API</text></g><g transform="translate(190 215)"><rect class="dark" width="135" height="80" rx="4"/><text class="tw" x="67" y="47" text-anchor="middle">Redirect API</text></g><g transform="translate(420 125)"><rect class="node" width="130" height="80" rx="4"/><text class="t" x="65" y="37" text-anchor="middle">PostgreSQL</text><text class="s" x="65" y="59" text-anchor="middle">authority</text></g><g transform="translate(420 215)"><rect class="blue" width="130" height="80" rx="4"/><text class="t" x="65" y="37" text-anchor="middle">Redis</text><text class="s" x="65" y="59" text-anchor="middle">cache-aside</text></g><g transform="translate(610 125)"><rect class="lime" width="60" height="170" rx="30"/><text class="t" x="30" y="72" text-anchor="middle" transform="rotate(-90 30 72)">independent scale</text></g></g>
  <g transform="translate(55 430)"><rect class="panel" width="1390" height="500" rx="5"/><text class="k" x="28" y="42">STAGE 3 · PRODUCTION-SHAPED REGIONAL DESIGN</text><text class="h" x="28" y="80">Keep redirect, management, and analytics on different paths</text><text class="s" x="28" y="108">Solid arrows are synchronous. Dashed blue arrows are asynchronous and may lag without breaking redirects.</text>
    <path class="line" d="M150 270H225M355 270H440M580 220H680M580 320H680M820 220H925M820 320H925"/><path class="async" d="M820 220H910V125H1020M1150 125H1240M1305 165V260"/>
    <g transform="translate(30 230)"><rect class="node" width="120" height="80" rx="4"/><text class="t" x="60" y="47" text-anchor="middle">Global users</text></g><g transform="translate(225 220)"><rect class="lime" width="130" height="100" rx="4"/><text class="t" x="65" y="42" text-anchor="middle">CDN / Edge</text><text class="s" x="65" y="68" text-anchor="middle">bounded TTL</text></g><g transform="translate(440 220)"><rect class="dark" width="140" height="100" rx="4"/><text class="tw" x="70" y="42" text-anchor="middle">Gateway</text><text class="sw" x="70" y="68" text-anchor="middle">route · rate limit</text></g>
    <g transform="translate(680 180)"><rect class="dark" width="140" height="80" rx="4"/><text class="tw" x="70" y="47" text-anchor="middle">Redirect API</text></g><g transform="translate(680 280)"><rect class="dark" width="140" height="80" rx="4"/><text class="tw" x="70" y="47" text-anchor="middle">Create API</text></g><g transform="translate(925 180)"><rect class="blue" width="135" height="80" rx="4"/><text class="t" x="67" y="37" text-anchor="middle">Redis</text><text class="s" x="67" y="59" text-anchor="middle">hot mappings</text></g><g transform="translate(925 280)"><ellipse class="node" cx="68" cy="13" rx="68" ry="13"/><path class="node" d="M0 13v62c0 7 30 13 68 13s68-6 68-13V13"/><text class="t" x="68" y="53" text-anchor="middle">PostgreSQL</text></g>
    <g transform="translate(1020 85)"><rect class="blue" width="130" height="80" rx="4"/><text class="t" x="65" y="37" text-anchor="middle">Event stream</text><text class="s" x="65" y="59" text-anchor="middle">click events</text></g><g transform="translate(1240 85)"><rect class="node" width="130" height="80" rx="4"/><text class="t" x="65" y="37" text-anchor="middle">Workers</text><text class="s" x="65" y="59" text-anchor="middle">aggregate</text></g><g transform="translate(1215 260)"><ellipse class="node" cx="90" cy="13" rx="90" ry="13"/><path class="node" d="M0 13v65c0 7 40 13 90 13s90-6 90-13V13"/><text class="t" x="90" y="54" text-anchor="middle">Analytics store</text></g>
    <rect class="lime" x="680" y="405" width="625" height="60" rx="4"/><text class="t" x="992" y="431" text-anchor="middle">Failure boundary</text><text class="s" x="992" y="453" text-anchor="middle">event stream or workers may fail; redirects still return Location</text>
  </g>
</svg>
