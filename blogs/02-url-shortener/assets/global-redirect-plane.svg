<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Global redirect plane</title><desc id="desc">A global architecture with edge points of presence, regional redirect services and caches, an authoritative write region, replicated lookup data, a revocation channel, and analytics.</desc>
  <defs><style>.bg{fill:#fafaf5}.zone{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.node{fill:#fafaf5;stroke:#11120f;stroke-width:2}.dark{fill:#11120f;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.line{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#a)}.repl{fill:none;stroke:#4e62a8;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#b)}.control{fill:none;stroke:#9eb43f;stroke-width:3;stroke-dasharray:4 6;marker-end:url(#c)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 25px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 16px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 16px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}.sw{font:500 13px Inter,Arial,sans-serif;fill:#c8cbc2}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#9eb43f"/></marker></defs>
  <rect width="1500" height="1000" class="bg"/><text class="k" x="55" y="46">GLOBAL HLD · REDIRECT DATA PLANE + AUTHORITATIVE CONTROL PATHS</text>
  <g transform="translate(55 80)"><rect class="zone" width="1390" height="190" rx="5"/><text class="k" x="25" y="38">EDGE PLANE · MANY POINTS OF PRESENCE</text><g transform="translate(60 75)"><rect class="node" width="150" height="80" rx="4"/><text class="t" x="75" y="37" text-anchor="middle">North America</text><text class="s" x="75" y="59" text-anchor="middle">users</text></g><g transform="translate(330 75)"><rect class="lime" width="175" height="80" rx="4"/><text class="t" x="87" y="37" text-anchor="middle">Edge POP A</text><text class="s" x="87" y="59" text-anchor="middle">redirect cache</text></g><g transform="translate(735 75)"><rect class="lime" width="175" height="80" rx="4"/><text class="t" x="87" y="37" text-anchor="middle">Edge POP B</text><text class="s" x="87" y="59" text-anchor="middle">redirect cache</text></g><g transform="translate(1140 75)"><rect class="node" width="150" height="80" rx="4"/><text class="t" x="75" y="37" text-anchor="middle">Europe / Asia</text><text class="s" x="75" y="59" text-anchor="middle">users</text></g><path class="line" d="M210 115H330M1290 115H910"/></g>
  <g transform="translate(55 315)"><rect class="zone" width="650" height="360" rx="5"/><text class="k" x="25" y="38">REGION A · REDIRECT DATA PLANE</text><g transform="translate(55 80)"><rect class="dark" width="180" height="90" rx="4"/><text class="tw" x="90" y="40" text-anchor="middle">Redirect service</text><text class="sw" x="90" y="64" text-anchor="middle">stateless replicas</text></g><g transform="translate(360 80)"><rect class="blue" width="180" height="90" rx="4"/><text class="t" x="90" y="40" text-anchor="middle">Regional Redis</text><text class="s" x="90" y="64" text-anchor="middle">L2 cache</text></g><g transform="translate(360 225)"><ellipse class="node" cx="90" cy="14" rx="90" ry="14"/><path class="node" d="M0 14v65c0 8 40 14 90 14s90-6 90-14V14"/><text class="t" x="90" y="56" text-anchor="middle">Lookup replica A</text></g><path class="line" d="M235 125H360M145 170V275H360"/><text class="s" x="53" y="320">Last-known replicated mappings keep serving</text></g>
  <g transform="translate(795 315)"><rect class="zone" width="650" height="360" rx="5"/><text class="k" x="25" y="38">REGION B · REDIRECT DATA PLANE</text><g transform="translate(55 80)"><rect class="dark" width="180" height="90" rx="4"/><text class="tw" x="90" y="40" text-anchor="middle">Redirect service</text><text class="sw" x="90" y="64" text-anchor="middle">stateless replicas</text></g><g transform="translate(360 80)"><rect class="blue" width="180" height="90" rx="4"/><text class="t" x="90" y="40" text-anchor="middle">Regional Redis</text><text class="s" x="90" y="64" text-anchor="middle">L2 cache</text></g><g transform="translate(360 225)"><ellipse class="node" cx="90" cy="14" rx="90" ry="14"/><path class="node" d="M0 14v65c0 8 40 14 90 14s90-6 90-14V14"/><text class="t" x="90" y="56" text-anchor="middle">Lookup replica B</text></g><path class="line" d="M235 125H360M145 170V275H360"/><text class="s" x="53" y="320">Regional failure routes traffic to another plane</text></g>
  <path class="line" d="M417 270V395M1087 270V395"/>
  <g transform="translate(55 735)"><rect class="zone" width="1390" height="190" rx="5"/><text class="k" x="25" y="38">WRITE + CONTROL PLANE</text><g transform="translate(50 70)"><rect class="dark" width="175" height="85" rx="4"/><text class="tw" x="87" y="37" text-anchor="middle">Create / Admin</text><text class="sw" x="87" y="60" text-anchor="middle">write authority</text></g><g transform="translate(335 70)"><ellipse class="node" cx="90" cy="13" rx="90" ry="13"/><path class="node" d="M0 13v62c0 7 40 13 90 13s90-6 90-13V13"/><text class="t" x="90" y="53" text-anchor="middle">Primary mappings</text></g><g transform="translate(650 70)"><rect class="blue" width="170" height="85" rx="4"/><text class="t" x="85" y="37" text-anchor="middle">Change stream</text><text class="s" x="85" y="60" text-anchor="middle">replicate mappings</text></g><g transform="translate(925 70)"><rect class="lime" width="170" height="85" rx="4"/><text class="t" x="85" y="37" text-anchor="middle">Revocation bus</text><text class="s" x="85" y="60" text-anchor="middle">purge + tombstone</text></g><g transform="translate(1180 70)"><rect class="node" width="160" height="85" rx="4"/><text class="t" x="80" y="37" text-anchor="middle">Analytics stream</text><text class="s" x="80" y="60" text-anchor="middle">eventual</text></g><path class="line" d="M225 112H335M515 112H650"/></g>
  <path class="repl" d="M790 805V705H505V635M790 705H1245V635"/>
  <path class="control" d="M1065 805V680H505V485M1065 680H1245V485"/>
  <text class="s" x="55" y="970">Solid: request/write path</text><text class="s" x="300" y="970" fill="#4e62a8">Blue dashed: mapping replication</text><text class="s" x="610" y="970" fill="#7b8f2a">Green dotted: urgent revocation</text>
</svg>
