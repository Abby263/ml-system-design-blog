<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">Create and resolve sequence</title><desc id="desc">Sequence diagram showing link creation, database uniqueness arbitration, cache-aside redirect resolution, and asynchronous click publication.</desc>
  <defs><style>.bg{fill:#fafaf5}.actor{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.dark{fill:#11120f;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.life{stroke:#aaaDA4;stroke-width:2;stroke-dasharray:7 7}.msg{fill:none;stroke:#11120f;stroke-width:2.3;marker-end:url(#a)}.ret{fill:none;stroke:#777a70;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#g)}.async{fill:none;stroke:#4e62a8;stroke-width:2.8;stroke-dasharray:9 7;marker-end:url(#b)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 17px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 17px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:600 14px ui-monospace,monospace;fill:#11120f}.note{font:600 14px Inter,Arial,sans-serif;fill:#55584f}.phase{font:800 18px Inter,Arial,sans-serif;fill:#11120f}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#777a70"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs>
  <rect width="1500" height="1080" class="bg"/><text class="k" x="55" y="46">SEQUENCE · POSTGRES COMMITS; CACHE AND ANALYTICS FOLLOW</text>
  <g transform="translate(40 80)"><rect class="actor" width="170" height="68" rx="5"/><text class="t" x="85" y="41" text-anchor="middle">Client</text></g><g transform="translate(285 80)"><rect class="dark" width="170" height="68" rx="5"/><text class="tw" x="85" y="41" text-anchor="middle">API</text></g><g transform="translate(555 80)"><rect class="actor" width="170" height="68" rx="5"/><text class="t" x="85" y="41" text-anchor="middle">LinkService</text></g><g transform="translate(825 80)"><rect class="blue" width="170" height="68" rx="5"/><text class="t" x="85" y="41" text-anchor="middle">Redis</text></g><g transform="translate(1095 80)"><rect class="actor" width="170" height="68" rx="5"/><text class="t" x="85" y="41" text-anchor="middle">PostgreSQL</text></g><g transform="translate(1305 80)"><rect class="lime" width="155" height="68" rx="5"/><text class="t" x="77" y="41" text-anchor="middle">Event stream</text></g>
  <line class="life" x1="125" y1="148" x2="125" y2="1025"/><line class="life" x1="370" y1="148" x2="370" y2="1025"/><line class="life" x1="640" y1="148" x2="640" y2="1025"/><line class="life" x1="910" y1="148" x2="910" y2="1025"/><line class="life" x1="1180" y1="148" x2="1180" y2="1025"/><line class="life" x1="1382" y1="148" x2="1382" y2="1025"/>
  <rect x="55" y="180" width="1390" height="40" fill="#f0f0e9"/><text class="phase" x="75" y="207">1 · CREATE A GENERATED LINK</text>
  <path class="msg" d="M125 265H370"/><text class="s" x="165" y="252">POST /links</text><path class="msg" d="M370 315H640"/><text class="s" x="420" y="302">validate + create()</text><path class="msg" d="M640 365H1180"/><text class="s" x="790" y="352">nextval(url_id_seq)</text><path class="ret" d="M1180 415H640"/><text class="s" x="835" y="402">56800235584</text><path class="msg" d="M640 465H1180"/><text class="s" x="755" y="452">INSERT code=Base62(id)</text><path class="ret" d="M1180 515H640"/><text class="s" x="850" y="502">committed LinkRecord</text><path class="msg" d="M640 565H910"/><text class="s" x="690" y="552">warm cache + TTL</text><path class="ret" d="M640 615H125"/><text class="s" x="280" y="602">201 Created</text>
  <rect x="55" y="650" width="1390" height="40" fill="#f0f0e9"/><text class="phase" x="75" y="677">2 · RESOLVE WITH CACHE-ASIDE</text>
  <path class="msg" d="M125 735H370"/><text class="s" x="175" y="722">GET /{code}</text><path class="msg" d="M370 775H640"/><text class="s" x="450" y="762">resolve()</text><path class="msg" d="M640 815H910"/><text class="s" x="735" y="802">GET key</text><path class="ret" d="M910 855H640"/><text class="s" x="720" y="842">hit or miss</text><path class="msg" d="M640 895H1180"/><text class="s" x="770" y="882">SELECT only on miss</text><path class="async" d="M640 940H1382"/><text class="s" x="895" y="927" fill="#4e62a8">publish click after decision</text><path class="ret" d="M640 990H125"/><text class="s" x="275" y="977">307 + Location</text>
  <rect x="860" y="280" width="530" height="92" rx="4" fill="#d9ff63" stroke="#11120f" stroke-width="2"/><text class="t" x="885" y="315">Concurrent custom alias?</text><text class="note" x="885" y="345">One INSERT wins; UNIQUE maps the other to HTTP 409.</text>
</svg>
