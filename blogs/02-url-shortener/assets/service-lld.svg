<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">URL shortener service class diagram</title><desc id="desc">A UML-inspired class diagram showing API handlers composing LinkService, LinkRepository, LinkCache, ShortCodeGenerator, and AnalyticsPublisher.</desc>
  <defs><style>.bg{fill:#fafaf5}.box{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.dark{fill:#11120f;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.rule{stroke:#11120f;stroke-width:2}.dep{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#a)}.async{fill:none;stroke:#4e62a8;stroke-width:2.8;stroke-dasharray:9 7;marker-end:url(#b)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.name{font:700 20px Inter,Arial,sans-serif;fill:#11120f}.nw{font:700 20px Inter,Arial,sans-serif;fill:#fafaf5}.st{font:600 13px Inter,Arial,sans-serif;fill:#55584f}.sw{font:600 13px Inter,Arial,sans-serif;fill:#bfc2b9}.m{font:600 14px ui-monospace,monospace;fill:#11120f}.mw{font:600 14px ui-monospace,monospace;fill:#fafaf5}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs>
  <rect width="1500" height="940" class="bg"/><text class="k" x="55" y="48">LOW-LEVEL DESIGN · COMPOSITION AROUND THE USE CASE</text>
  <g transform="translate(535 90)"><rect class="dark" width="430" height="190" rx="5"/><text class="sw" x="215" y="30" text-anchor="middle">«HTTP boundary»</text><text class="nw" x="215" y="62" text-anchor="middle">API handlers</text><line x1="0" y1="82" x2="430" y2="82" stroke="#fafaf5" stroke-width="2"/><text class="mw" x="25" y="118">create_link(request)</text><text class="mw" x="25" y="150">redirect(short_code)</text><text class="mw" x="25" y="178">get_link(short_code)</text></g>
  <g transform="translate(535 375)"><rect class="lime" width="430" height="230" rx="5"/><text class="st" x="215" y="30" text-anchor="middle">«use-case policy»</text><text class="name" x="215" y="62" text-anchor="middle">LinkService</text><line class="rule" x1="0" y1="82" x2="430" y2="82"/><text class="m" x="25" y="120">- repository: LinkRepository</text><text class="m" x="25" y="153">- cache: LinkCache</text><text class="m" x="25" y="186">+ create(request): LinkRecord</text><text class="m" x="25" y="216">+ resolve(code): LinkRecord?</text></g>
  <path class="dep" d="M750 280V375"/><text class="st" x="770" y="333">delegates</text>
  <g transform="translate(60 700)"><rect class="box" width="330" height="180" rx="5"/><text class="st" x="165" y="28" text-anchor="middle">«durable adapter»</text><text class="name" x="165" y="58" text-anchor="middle">LinkRepository</text><line class="rule" x1="0" y1="78" x2="330" y2="78"/><text class="m" x="20" y="115">+ create(...)</text><text class="m" x="20" y="148">+ get_active(code)</text></g>
  <g transform="translate(435 700)"><rect class="blue" width="300" height="180" rx="5"/><text class="st" x="150" y="28" text-anchor="middle">«disposable adapter»</text><text class="name" x="150" y="58" text-anchor="middle">LinkCache</text><line class="rule" x1="0" y1="78" x2="300" y2="78"/><text class="m" x="20" y="115">+ get(code)</text><text class="m" x="20" y="148">+ put(record)</text></g>
  <g transform="translate(780 700)"><rect class="box" width="315" height="180" rx="5"/><text class="st" x="157" y="28" text-anchor="middle">«policy strategy»</text><text class="name" x="157" y="58" text-anchor="middle">ShortCodeGenerator</text><line class="rule" x1="0" y1="78" x2="315" y2="78"/><text class="m" x="20" y="115">+ generate(id): str</text><text class="m" x="20" y="148">Base62 | Random | Snowflake</text></g>
  <g transform="translate(1140 700)"><rect class="box" width="300" height="180" rx="5"/><text class="st" x="150" y="28" text-anchor="middle">«best-effort port»</text><text class="name" x="150" y="58" text-anchor="middle">AnalyticsPublisher</text><line class="rule" x1="0" y1="78" x2="300" y2="78"/><text class="m" x="20" y="115">+ publish_click(...)</text><text class="m" x="20" y="148">must not break redirect</text></g>
  <path class="dep" d="M640 605V650H225V700"/><path class="dep" d="M700 605V665H585V700"/><path class="dep" d="M820 605V665H937V700"/><path class="async" d="M965 490H1290V700"/>
  <text class="st" x="73" y="670">SQL + uniqueness</text><text class="st" x="448" y="670">cache-aside</text><text class="st" x="795" y="670">variation only when needed</text><text class="st" x="1165" y="645" fill="#4e62a8">after redirect decision</text>
</svg>
