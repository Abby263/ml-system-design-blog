<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">URL shortener data model</title><desc id="desc">Low-level data model for authoritative short links, cached mappings, append-only click events, and daily click aggregates.</desc>
  <defs><style>.bg{fill:#fafaf5}.panel{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.head{fill:#11120f}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.line{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#a)}.async{fill:none;stroke:#4e62a8;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#b)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 21px Inter,Arial,sans-serif;fill:#11120f}.hw{font:700 21px Inter,Arial,sans-serif;fill:#fafaf5}.f{font:600 15px ui-monospace,monospace;fill:#11120f}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.note{font:700 14px Inter,Arial,sans-serif;fill:#4e62a8}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs>
  <rect width="1500" height="920" class="bg"/><text class="k" x="55" y="48">LOW-LEVEL DATA DESIGN · DIFFERENT WRITE SHAPES NEED DIFFERENT PATHS</text>
  <g transform="translate(90 115)"><rect class="panel" width="500" height="530" rx="5"/><rect class="head" width="500" height="68" rx="5"/><text class="hw" x="26" y="43">short_links · source of truth</text>
    <text class="f" x="30" y="112">id            BIGINT      PK</text><text class="f" x="30" y="155">short_code    VARCHAR     UNIQUE</text><text class="f" x="30" y="198">target_url    TEXT</text><text class="f" x="30" y="241">created_at    TIMESTAMPTZ</text><text class="f" x="30" y="284">expires_at    TIMESTAMPTZ?</text><text class="f" x="30" y="327">deleted_at    TIMESTAMPTZ?</text><line x1="30" y1="365" x2="470" y2="365" stroke="#c8cbc2" stroke-width="2"/><text class="s" x="30" y="405">Hot access: exact lookup by short_code</text><text class="s" x="30" y="438">Uniqueness settles concurrent claims</text><text class="s" x="30" y="471">Mappings change rarely; clicks never</text><text class="s" x="30" y="504">update this row synchronously</text>
  </g>
  <g transform="translate(850 115)"><rect class="blue" width="560" height="245" rx="5"/><text class="h" x="28" y="48">Redis cache entry</text><text class="f" x="28" y="92">key   short-link:v1:{code}</text><text class="f" x="28" y="132">value { target_url, expires_at, ... }</text><text class="f" x="28" y="172">TTL   300s positive · 15s missing</text><text class="s" x="28" y="211">Disposable. A miss returns to short_links.</text></g>
  <g transform="translate(700 545)"><rect class="lime" width="330" height="235" rx="5"/><text class="h" x="28" y="47">click_event</text><text class="f" x="28" y="91">event_id</text><text class="f" x="28" y="126">short_code</text><text class="f" x="28" y="161">occurred_at</text><text class="f" x="28" y="196">coarse context</text></g>
  <g transform="translate(1100 545)"><rect class="panel" width="310" height="235" rx="5"/><text class="h" x="28" y="47">daily_clicks</text><text class="f" x="28" y="91">short_code  PK</text><text class="f" x="28" y="126">click_date  PK</text><text class="f" x="28" y="161">clicks</text><text class="s" x="28" y="202">Query-friendly aggregate</text></g>
  <path class="line" d="M590 235H850"/><text class="s" x="652" y="218">cache fill</text><path class="async" d="M590 520C625 610 640 662 700 662"/><text class="note" x="480" y="603">append; never update link row</text><path class="async" d="M1030 662H1100"/>
  <g transform="translate(90 700)"><rect class="panel" width="500" height="100" rx="5"/><text class="h" x="25" y="40">Invariant</text><text class="s" x="25" y="70">One active code maps to at most one destination.</text></g>
</svg>
