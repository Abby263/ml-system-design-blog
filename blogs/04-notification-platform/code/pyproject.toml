[project]
name = "designing-ml-systems-notification-platform"
version = "0.1.0"
description = "Durable notification workflow for the Designing ML Systems series"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "pydantic-settings==2.10.1",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
notification-worker = "app.worker:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
