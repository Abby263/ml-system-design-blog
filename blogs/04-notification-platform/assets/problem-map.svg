<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc"><title id="title">Notification platform problem map</title><desc id="desc">A mind map connecting notification intent to contract, policy, durability, execution, providers, feedback, and operations.</desc><defs><style>.bg{fill:#fafaf5}.card{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.core{fill:#11120f}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.line{fill:none;stroke:#11120f;stroke-width:3}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 26px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 18px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 26px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}</style></defs><rect class="bg" width="1500" height="920"/><text class="k" x="55" y="52">PROBLEM MAP · ONE INTENT, MANY FAILURE BOUNDARIES</text><path class="line" d="M750 410V260M620 450H410M880 450H1090M690 535L510 690M810 535L990 690M750 535V735"/><g transform="translate(570 360)"><rect class="core" width="360" height="180" rx="6"/><text class="tw" x="180" y="73" text-anchor="middle">Notification intent</text><text x="180" y="109" text-anchor="middle" style="font:500 15px Inter,Arial,sans-serif;fill:#c8cbc2">durable · policy-aware · asynchronous</text><text x="180" y="137" text-anchor="middle" style="font:500 15px Inter,Arial,sans-serif;fill:#c8cbc2">auditable outcome, not a Boolean</text></g><g transform="translate(555 90)"><rect class="lime" width="390" height="170" rx="6"/><text class="t" x="195" y="45" text-anchor="middle">DELIVERY CONTRACT</text><text class="s" x="28" y="79">accepted ≠ provider accepted</text><text class="s" x="28" y="106">provider accepted ≠ delivered</text><text class="s" x="28" y="133">delivered ≠ displayed or read</text></g><g transform="translate(65 350)"><rect class="card" width="345" height="200" rx="6"/><text class="t" x="28" y="43">POLICY</text><text class="s" x="28" y="78">consent · category · locale</text><text class="s" x="28" y="106">quiet hours · expiry · fallback</text><text class="s" x="28" y="134">template + routing versions</text><text class="s" x="28" y="162">tenant and recipient limits</text></g><g transform="translate(1090 350)"><rect class="blue" width="345" height="200" rx="6"/><text class="t" x="28" y="43">DURABILITY</text><text class="s" x="28" y="78">idempotency constraints</text><text class="s" x="28" y="106">transactional outbox</text><text class="s" x="28" y="134">at-least-once jobs + leases</text><text class="s" x="28" y="162">monotonic state transitions</text></g><g transform="translate(215 680)"><rect class="blue" width="360" height="175" rx="6"/><text class="t" x="28" y="43">EXECUTION</text><text class="s" x="28" y="78">fan-out · priority queues</text><text class="s" x="28" y="106">backpressure · rate limits</text><text class="s" x="28" y="134">retry · expiry · dead letters</text></g><g transform="translate(570 735)"><rect class="lime" width="360" height="150" rx="6"/><text class="t" x="28" y="43">PROVIDERS</text><text class="s" x="28" y="78">email · SMS · APNs / FCM</text><text class="s" x="28" y="106">Strategy · Factory · Adapter</text></g><g transform="translate(925 680)"><rect class="card" width="360" height="175" rx="6"/><text class="t" x="28" y="43">FEEDBACK + OPERATIONS</text><text class="s" x="28" y="78">signed duplicate callbacks</text><text class="s" x="28" y="106">queue age · user outcomes</text><text class="s" x="28" y="134">replay · audit · suppression</text></g></svg>
