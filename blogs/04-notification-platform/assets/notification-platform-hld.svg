<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">Notification platform high-level design</title><desc id="desc">Architecture showing synchronous durable acceptance, asynchronous fan-out and delivery, provider callbacks, and control and observability planes.</desc><defs><style>.bg{fill:#fafaf5}.panel{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.n{fill:#fafaf5;stroke:#11120f;stroke-width:2}.dark{fill:#11120f}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.a{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#x)}.back{fill:none;stroke:#4e62a8;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#q)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 25px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 16px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 16px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs><rect class="bg" width="1600" height="1040"/><text class="k" x="50" y="48">HIGH-LEVEL DESIGN · DURABLE ACCEPTANCE, ASYNCHRONOUS EXECUTION</text><g transform="translate(50 78)"><rect class="panel" width="1500" height="240" rx="5"/><text class="k" x="25" y="38">SYNCHRONOUS ACCEPTANCE PATH · &lt; 100 MS P99</text><path class="a" d="M180 145H285M465 145H580M780 145H900M1110 145H1230"/><g transform="translate(45 105)"><rect class="n" width="135" height="80" rx="4"/><text class="t" x="68" y="46" text-anchor="middle">Producers</text></g><g transform="translate(285 95)"><rect class="dark" width="180" height="100" rx="4"/><text class="tw" x="90" y="40" text-anchor="middle">Notification API</text><text class="s" x="90" y="65" text-anchor="middle" fill="#c8cbc2">auth · validate · quota</text></g><g transform="translate(580 95)"><rect class="blue" width="200" height="100" rx="4"/><text class="t" x="100" y="39" text-anchor="middle">Workflow DB</text><text class="s" x="100" y="65" text-anchor="middle">intent + idempotency</text></g><g transform="translate(900 95)"><rect class="lime" width="210" height="100" rx="4"/><text class="t" x="105" y="39" text-anchor="middle">Outbox</text><text class="s" x="105" y="65" text-anchor="middle">same transaction</text></g><g transform="translate(1230 105)"><rect class="n" width="210" height="80" rx="4"/><text class="t" x="105" y="46" text-anchor="middle">202 + status URL</text></g></g><g transform="translate(50 350)"><rect class="panel" width="1500" height="440" rx="5"/><text class="k" x="25" y="38">ASYNCHRONOUS DELIVERY DATA PLANE</text><path class="a" d="M210 210H300M480 210H570M770 210H850M1040 115H1135M1040 210H1135M1040 305H1135M1315 115H1410M1315 210H1410M1315 305H1410"/><g transform="translate(45 165)"><rect class="blue" width="165" height="90" rx="4"/><text class="t" x="83" y="38" text-anchor="middle">Outbox relay</text><text class="s" x="83" y="62" text-anchor="middle">at-least-once</text></g><g transform="translate(300 145)"><rect class="dark" width="180" height="130" rx="4"/><text class="tw" x="90" y="39" text-anchor="middle">Fan-out + policy</text><text class="s" x="90" y="67" text-anchor="middle" fill="#c8cbc2">preferences · expiry</text><text class="s" x="90" y="91" text-anchor="middle" fill="#c8cbc2">template render</text></g><g transform="translate(570 145)"><rect class="lime" width="200" height="130" rx="4"/><text class="t" x="100" y="37" text-anchor="middle">Priority queues</text><text class="s" x="100" y="65" text-anchor="middle">transactional / bulk</text><text class="s" x="100" y="89" text-anchor="middle">email / SMS / push</text></g><g transform="translate(850 70)"><rect class="blue" width="190" height="90" rx="4"/><text class="t" x="95" y="38" text-anchor="middle">Email workers</text><text class="s" x="95" y="62" text-anchor="middle">lease + rate limit</text></g><g transform="translate(850 165)"><rect class="blue" width="190" height="90" rx="4"/><text class="t" x="95" y="38" text-anchor="middle">SMS workers</text><text class="s" x="95" y="62" text-anchor="middle">lease + rate limit</text></g><g transform="translate(850 260)"><rect class="blue" width="190" height="90" rx="4"/><text class="t" x="95" y="38" text-anchor="middle">Push workers</text><text class="s" x="95" y="62" text-anchor="middle">lease + rate limit</text></g><g transform="translate(1135 70)"><rect class="n" width="180" height="90" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Email adapter</text><text class="s" x="90" y="62" text-anchor="middle">render response</text></g><g transform="translate(1135 165)"><rect class="n" width="180" height="90" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">SMS adapter</text><text class="s" x="90" y="62" text-anchor="middle">normalize error</text></g><g transform="translate(1135 260)"><rect class="n" width="180" height="90" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Push adapter</text><text class="s" x="90" y="62" text-anchor="middle">collapse + expiry</text></g><g transform="translate(1410 70)"><rect class="dark" width="65" height="90" rx="4"/><text class="tw" x="33" y="52" text-anchor="middle">ESP</text></g><g transform="translate(1410 165)"><rect class="dark" width="65" height="90" rx="4"/><text class="tw" x="33" y="52" text-anchor="middle">SMS</text></g><g transform="translate(1410 260)"><rect class="dark" width="65" height="90" rx="4"/><text class="tw" x="33" y="42" text-anchor="middle">APNs</text><text class="tw" x="33" y="65" text-anchor="middle">FCM</text></g><path class="back" d="M1440 365V400H945V350"/><text class="k" x="1080" y="420" fill="#4e62a8">SIGNED CALLBACKS → DEDUPE → GUARDED STATE UPDATE</text></g><g transform="translate(50 825)"><rect class="panel" width="1500" height="160" rx="5"/><text class="k" x="25" y="35">CONTROL + OBSERVABILITY PLANE · DATA PLANE USES LAST-KNOWN-GOOD CONFIG</text><g transform="translate(50 68)"><rect class="n" width="255" height="65" rx="4"/><text class="t" x="128" y="39" text-anchor="middle">Templates + preferences</text></g><g transform="translate(390 68)"><rect class="n" width="255" height="65" rx="4"/><text class="t" x="128" y="39" text-anchor="middle">Provider routing + secrets</text></g><g transform="translate(730 68)"><rect class="lime" width="255" height="65" rx="4"/><text class="t" x="128" y="39" text-anchor="middle">Metrics · traces · SLOs</text></g><g transform="translate(1070 68)"><rect class="n" width="330" height="65" rx="4"/><text class="t" x="165" y="39" text-anchor="middle">Audit · suppression · replay console</text></g></g></svg>
