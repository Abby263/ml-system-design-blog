<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" role="img" aria-labelledby="title desc"><title id="title">Provider retry decision tree</title><desc id="desc">Decision tree classifying provider outcomes into accepted, retryable throttling, transient errors, unknown outcomes, invalid endpoints, and permanent request errors.</desc><defs><style>.bg{fill:#fafaf5}.n{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.dark{fill:#11120f}.a{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#x)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 17px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 17px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}.edge{font:700 12px ui-monospace,monospace;fill:#777a70}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker></defs><rect class="bg" width="1500" height="960"/><text class="k" x="50" y="48">DECISION TREE · RETRY IS AN ERROR-CLASSIFICATION POLICY</text><g transform="translate(575 80)"><rect class="dark" width="350" height="100" rx="4"/><text class="tw" x="175" y="42" text-anchor="middle">Provider call returned</text><text x="175" y="69" text-anchor="middle" style="font:500 14px Inter,Arial,sans-serif;fill:#c8cbc2">or timed out</text></g><path class="a" d="M750 180V235H260V300M750 235H750V300M750 235H1240V300"/><text class="edge" x="480" y="223">KNOWN SUCCESS</text><text class="edge" x="810" y="223">KNOWN ERROR</text><text class="edge" x="1120" y="223">UNKNOWN OUTCOME</text><g transform="translate(100 300)"><rect class="lime" width="320" height="110" rx="4"/><text class="t" x="160" y="43" text-anchor="middle">ACCEPTED</text><text class="s" x="160" y="70" text-anchor="middle">persist provider message ID</text><text class="s" x="160" y="91" text-anchor="middle">wait for callback if available</text></g><g transform="translate(590 300)"><rect class="blue" width="320" height="110" rx="4"/><text class="t" x="160" y="43" text-anchor="middle">CLASSIFY RESPONSE</text><text class="s" x="160" y="70" text-anchor="middle">status + provider reason</text><text class="s" x="160" y="91" text-anchor="middle">adapter owns translation</text></g><g transform="translate(1080 300)"><rect class="n" width="320" height="110" rx="4"/><text class="t" x="160" y="43" text-anchor="middle">TIMEOUT AFTER SEND?</text><text class="s" x="160" y="70" text-anchor="middle">query status if supported</text><text class="s" x="160" y="91" text-anchor="middle">reuse delivery idempotency key</text></g><path class="a" d="M750 410V470H225V550M750 470H575V550M750 470H925V550M750 470H1275V550"/><g transform="translate(75 550)"><rect class="blue" width="300" height="125" rx="4"/><text class="t" x="150" y="38" text-anchor="middle">THROTTLED</text><text class="s" x="150" y="67" text-anchor="middle">429 / provider quota</text><text class="s" x="150" y="91" text-anchor="middle">honor Retry-After</text></g><g transform="translate(425 550)"><rect class="blue" width="300" height="125" rx="4"/><text class="t" x="150" y="38" text-anchor="middle">TRANSIENT</text><text class="s" x="150" y="67" text-anchor="middle">connection / selected 5xx</text><text class="s" x="150" y="91" text-anchor="middle">full-jitter backoff</text></g><g transform="translate(775 550)"><rect class="n" width="300" height="125" rx="4"/><text class="t" x="150" y="38" text-anchor="middle">INVALID ENDPOINT</text><text class="s" x="150" y="67" text-anchor="middle">APNs 410 / hard bounce</text><text class="s" x="150" y="91" text-anchor="middle">fail + suppress endpoint</text></g><g transform="translate(1125 550)"><rect class="n" width="300" height="125" rx="4"/><text class="t" x="150" y="38" text-anchor="middle">PERMANENT REQUEST</text><text class="s" x="150" y="67" text-anchor="middle">bad payload / auth / policy</text><text class="s" x="150" y="91" text-anchor="middle">fail; fix before replay</text></g><path class="a" d="M225 675V750H575M575 675V750M925 675V750H900M1275 675V750H900"/><g transform="translate(400 750)"><rect class="dark" width="350" height="125" rx="4"/><text class="tw" x="175" y="40" text-anchor="middle">RETRY BUDGET CHECK</text><text x="175" y="69" text-anchor="middle" style="font:500 13px Inter,Arial,sans-serif;fill:#c8cbc2">attempts left AND now + delay &lt; expiry</text><text x="175" y="94" text-anchor="middle" style="font:500 13px Inter,Arial,sans-serif;fill:#c8cbc2">otherwise terminal failure / expiry</text></g><g transform="translate(800 750)"><rect class="n" width="350" height="125" rx="4"/><text class="t" x="175" y="40" text-anchor="middle">NO AUTOMATIC RETRY</text><text class="s" x="175" y="69" text-anchor="middle">record reason + raw code</text><text class="s" x="175" y="94" text-anchor="middle">route repairable work to DLQ</text></g></svg>
