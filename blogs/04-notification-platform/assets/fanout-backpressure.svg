<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc"><title id="title">Notification fan-out and backpressure</title><desc id="desc">Flow from tenant admission through fan-out, priority queues, worker pools, provider token buckets, and providers with feedback loops from backlog age and provider health.</desc><defs><style>.bg{fill:#fafaf5}.panel{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.n{fill:#fafaf5;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.dark{fill:#11120f}.a{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#x)}.feedback{fill:none;stroke:#4e62a8;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#q)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 16px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 16px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs><rect class="bg" width="1500" height="920"/><text class="k" x="50" y="48">FLOW CONTROL · QUEUES ABSORB BURSTS; DOWNSTREAM CAPACITY SETS THROUGHPUT</text><path class="a" d="M190 410H280M460 410H555M765 250H850M765 410H850M765 570H850M1040 250H1140M1040 410H1140M1040 570H1140M1320 250H1420M1320 410H1420M1320 570H1420"/><g transform="translate(45 355)"><rect class="n" width="145" height="110" rx="4"/><text class="t" x="73" y="43" text-anchor="middle">Producers</text><text class="s" x="73" y="70" text-anchor="middle">campaign bursts</text></g><g transform="translate(280 340)"><rect class="dark" width="180" height="140" rx="4"/><text class="tw" x="90" y="41" text-anchor="middle">Admission</text><text class="s" x="90" y="70" text-anchor="middle" fill="#c8cbc2">tenant quota</text><text class="s" x="90" y="94" text-anchor="middle" fill="#c8cbc2">schedule smoothing</text><text class="s" x="90" y="118" text-anchor="middle" fill="#c8cbc2">load shedding</text></g><g transform="translate(555 165)"><rect class="lime" width="210" height="170" rx="4"/><text class="t" x="105" y="40" text-anchor="middle">Transactional</text><text class="s" x="105" y="68" text-anchor="middle">reserved capacity</text><text class="s" x="105" y="92" text-anchor="middle">oldest age = 3 s</text><text class="s" x="105" y="126" text-anchor="middle">email · SMS · push</text></g><g transform="translate(555 345)"><rect class="blue" width="210" height="130" rx="4"/><text class="t" x="105" y="40" text-anchor="middle">Normal</text><text class="s" x="105" y="68" text-anchor="middle">weighted scheduling</text><text class="s" x="105" y="92" text-anchor="middle">oldest age = 18 s</text></g><g transform="translate(555 505)"><rect class="n" width="210" height="170" rx="4"/><text class="t" x="105" y="40" text-anchor="middle">Bulk</text><text class="s" x="105" y="68" text-anchor="middle">bounded fan-out</text><text class="s" x="105" y="92" text-anchor="middle">oldest age = 9 min</text><text class="s" x="105" y="126" text-anchor="middle">minimum quota share</text></g><g transform="translate(850 205)"><rect class="blue" width="190" height="90" rx="4"/><text class="t" x="95" y="38" text-anchor="middle">Email pool</text><text class="s" x="95" y="62" text-anchor="middle">scale to safe cap</text></g><g transform="translate(850 365)"><rect class="blue" width="190" height="90" rx="4"/><text class="t" x="95" y="38" text-anchor="middle">SMS pool</text><text class="s" x="95" y="62" text-anchor="middle">scale to safe cap</text></g><g transform="translate(850 525)"><rect class="blue" width="190" height="90" rx="4"/><text class="t" x="95" y="38" text-anchor="middle">Push pool</text><text class="s" x="95" y="62" text-anchor="middle">scale to safe cap</text></g><g transform="translate(1140 205)"><rect class="lime" width="180" height="90" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">ESP bucket</text><text class="s" x="90" y="62" text-anchor="middle">account + domain</text></g><g transform="translate(1140 365)"><rect class="lime" width="180" height="90" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">SMS bucket</text><text class="s" x="90" y="62" text-anchor="middle">country + sender</text></g><g transform="translate(1140 525)"><rect class="lime" width="180" height="90" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Push bucket</text><text class="s" x="90" y="62" text-anchor="middle">project + device</text></g><g transform="translate(1420 205)"><rect class="dark" width="50" height="90" rx="4"/><text class="tw" x="25" y="52" text-anchor="middle">ESP</text></g><g transform="translate(1420 365)"><rect class="dark" width="50" height="90" rx="4"/><text class="tw" x="25" y="52" text-anchor="middle">SMS</text></g><g transform="translate(1420 525)"><rect class="dark" width="50" height="90" rx="4"/><text class="tw" x="25" y="42" text-anchor="middle">APN</text><text class="tw" x="25" y="64" text-anchor="middle">FCM</text></g><path class="feedback" d="M1230 660V770H370V480"/><rect class="panel" x="500" y="735" width="650" height="115" rx="4"/><text class="t" x="825" y="773" text-anchor="middle">FEEDBACK CONTROLLER</text><text class="s" x="825" y="800" text-anchor="middle">queue age · expiry risk · provider latency · 429 / 5xx · callback lag</text><text class="s" x="825" y="824" text-anchor="middle">slow fan-out · reserve capacity · open circuit · gradual failover · shed obsolete work</text></svg>
