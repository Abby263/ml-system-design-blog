<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc"><title id="title">Notification delivery state machine</title><desc id="desc">A guarded state machine for queued, leased, sending, provider accepted, retry scheduled, delivered, read, suppressed, expired, and failed states.</desc><defs><style>.bg{fill:#fafaf5}.n{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.dark{fill:#11120f}.term{fill:#fafaf5;stroke:#11120f;stroke-width:3}.a{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#x)}.r{fill:none;stroke:#4e62a8;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#q)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 17px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 17px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs><rect class="bg" width="1500" height="920"/><text class="k" x="50" y="48">STATE MACHINE · LOGICAL DELIVERY + REPEATABLE ATTEMPTS</text><path class="a" d="M205 275H320M500 275H615M795 275H930M1110 275H1225"/><path class="r" d="M705 330V480H465V405"/><path class="a" d="M1020 330V505H1165"/><path class="a" d="M1315 330V505H1340"/><path class="a" d="M410 330V505H290"/><path class="a" d="M410 220V135H290"/><path class="a" d="M705 220V135H705"/><path class="a" d="M1020 220V135H1120"/><g transform="translate(55 230)"><rect class="n" width="150" height="90" rx="4"/><text class="t" x="75" y="53" text-anchor="middle">QUEUED</text></g><g transform="translate(320 230)"><rect class="blue" width="180" height="90" rx="4"/><text class="t" x="90" y="40" text-anchor="middle">LEASED</text><text class="s" x="90" y="63" text-anchor="middle">lease can expire</text></g><g transform="translate(615 230)"><rect class="dark" width="180" height="90" rx="4"/><text class="tw" x="90" y="40" text-anchor="middle">SENDING</text><text class="s" x="90" y="63" text-anchor="middle" fill="#c8cbc2">attempt N</text></g><g transform="translate(930 230)"><rect class="blue" width="180" height="90" rx="4"/><text class="t" x="90" y="37" text-anchor="middle">PROVIDER</text><text class="t" x="90" y="59" text-anchor="middle">ACCEPTED</text></g><g transform="translate(1225 230)"><rect class="lime" width="180" height="90" rx="4"/><text class="t" x="90" y="53" text-anchor="middle">DELIVERED</text></g><g transform="translate(320 480)"><rect class="blue" width="290" height="110" rx="4"/><text class="t" x="145" y="43" text-anchor="middle">RETRY SCHEDULED</text><text class="s" x="145" y="70" text-anchor="middle">next_attempt_at + jitter</text><text class="s" x="145" y="91" text-anchor="middle">same logical delivery</text></g><g transform="translate(1165 480)"><rect class="term" width="210" height="110" rx="4"/><text class="t" x="105" y="43" text-anchor="middle">FAILED</text><text class="s" x="105" y="70" text-anchor="middle">terminal / attempts</text><text class="s" x="105" y="91" text-anchor="middle">exhausted</text></g><g transform="translate(1330 680)"><rect class="lime" width="120" height="80" rx="4"/><text class="t" x="60" y="47" text-anchor="middle">READ</text></g><path class="a" d="M1315 320V680H1390"/><g transform="translate(120 480)"><rect class="term" width="170" height="110" rx="4"/><text class="t" x="85" y="43" text-anchor="middle">EXPIRED</text><text class="s" x="85" y="71" text-anchor="middle">time budget wins</text></g><g transform="translate(120 90)"><rect class="term" width="170" height="90" rx="4"/><text class="t" x="85" y="39" text-anchor="middle">SUPPRESSED</text><text class="s" x="85" y="63" text-anchor="middle">policy / endpoint</text></g><g transform="translate(595 90)"><rect class="term" width="220" height="90" rx="4"/><text class="t" x="110" y="39" text-anchor="middle">INVALID ENDPOINT</text><text class="s" x="110" y="63" text-anchor="middle">fail + future suppress</text></g><g transform="translate(1010 90)"><rect class="term" width="220" height="90" rx="4"/><text class="t" x="110" y="39" text-anchor="middle">REQUEST REJECTED</text><text class="s" x="110" y="63" text-anchor="middle">fix bytes or config</text></g><rect class="n" x="60" y="815" width="1380" height="60" rx="4"/><text class="s" x="750" y="841" text-anchor="middle">Guard every transition with current state/version. Keep raw provider events and attempts immutable.</text><text class="s" x="750" y="861" text-anchor="middle">A late “sent” event cannot move DELIVERED backward; callbacks may extend truth, never erase it.</text></svg>
