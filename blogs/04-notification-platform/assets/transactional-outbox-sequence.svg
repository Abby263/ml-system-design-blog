<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">Transactional outbox sequence</title><desc id="desc">Sequence from producer to API, database transaction, outbox relay, broker, and idempotent fan-out with a duplicate publish after relay failure.</desc><defs><style>.bg{fill:#fafaf5}.head{fill:#11120f}.head2{fill:#8da8ff;stroke:#11120f;stroke-width:2}.head3{fill:#d9ff63;stroke:#11120f;stroke-width:2}.life{stroke:#777a70;stroke-width:2;stroke-dasharray:8 8}.call{stroke:#11120f;stroke-width:2.5;marker-end:url(#a)}.dup{stroke:#4e62a8;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#b)}.note{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 17px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 17px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.n{font:700 14px ui-monospace,monospace;fill:#11120f}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs><rect class="bg" width="1500" height="900"/><text class="k" x="50" y="48">SEQUENCE · CLOSE THE DUAL-WRITE GAP, EXPECT DUPLICATE PUBLICATION</text><g transform="translate(45 85)"><rect class="head" width="175" height="65" rx="4"/><text class="tw" x="88" y="40" text-anchor="middle">Producer</text></g><g transform="translate(285 85)"><rect class="head2" width="175" height="65" rx="4"/><text class="t" x="88" y="40" text-anchor="middle">API</text></g><g transform="translate(525 85)"><rect class="head3" width="175" height="65" rx="4"/><text class="t" x="88" y="40" text-anchor="middle">Workflow DB</text></g><g transform="translate(765 85)"><rect class="head2" width="175" height="65" rx="4"/><text class="t" x="88" y="40" text-anchor="middle">Outbox relay</text></g><g transform="translate(1005 85)"><rect class="head3" width="175" height="65" rx="4"/><text class="t" x="88" y="40" text-anchor="middle">Broker</text></g><g transform="translate(1245 85)"><rect class="head" width="210" height="65" rx="4"/><text class="tw" x="105" y="40" text-anchor="middle">Fan-out consumer</text></g><path class="life" d="M132 150V850M372 150V850M612 150V850M852 150V850M1092 150V850M1350 150V850"/><path class="call" d="M132 205H372"/><text class="n" x="252" y="194" text-anchor="middle">POST + idempotency key</text><path class="call" d="M372 275H612"/><text class="n" x="492" y="264" text-anchor="middle">BEGIN</text><path class="call" d="M372 325H612"/><text class="n" x="492" y="314" text-anchor="middle">INSERT notification</text><path class="call" d="M372 375H612"/><text class="n" x="492" y="364" text-anchor="middle">INSERT outbox job</text><path class="call" d="M372 425H612"/><text class="n" x="492" y="414" text-anchor="middle">COMMIT both</text><path class="call" d="M372 475H132"/><text class="n" x="252" y="464" text-anchor="middle">202 Accepted</text><path class="call" d="M852 530H612"/><text class="n" x="732" y="519" text-anchor="middle">lease committed row</text><path class="call" d="M852 585H1092"/><text class="n" x="972" y="574" text-anchor="middle">publish event</text><path class="call" d="M1092 640H1350"/><text class="n" x="1221" y="629" text-anchor="middle">deliver event</text><rect class="note" x="760" y="655" width="410" height="78" rx="4"/><text class="t" x="785" y="687">Relay crashes before marking sent</text><text class="s" x="785" y="713">lease expires; the same event is published again</text><path class="dup" d="M852 770H1092"/><text class="n" x="972" y="758" text-anchor="middle" fill="#4e62a8">duplicate publish</text><path class="dup" d="M1092 820H1350"/><text class="n" x="1221" y="808" text-anchor="middle" fill="#4e62a8">unique delivery makes this a no-op</text></svg>
