[project]
name = "designing-ml-systems-fraud-detection"
version = "0.1.0"
description = "Auditable real-time fraud decision companion for Designing ML Systems"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "numpy==2.3.2",
    "pydantic-settings==2.10.1",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
    "ruff==0.12.7",
]

[project.scripts]
fraud-train = "app.train:main"
fraud-evaluate = "app.evaluate:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
