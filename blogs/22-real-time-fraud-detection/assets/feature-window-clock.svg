<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">Fraud feature window clock</title><desc id="desc">Concentric rings around the current payment represent one minute, ten minute, one hour, one day, and long-term entity feature windows.</desc><defs><style>.bg{fill:#fafaf5}.ink{fill:#11120f}.blue{fill:#8da8ff}.lime{fill:#d9ff63}.gray{fill:#dedfd8}.ring{fill:none;stroke:#11120f;stroke-width:3}.tick{stroke:#11120f;stroke-width:2}.k{font:700 14px ui-monospace,monospace;letter-spacing:2px;fill:#66695f}.h{font:700 32px Inter,Arial,sans-serif;fill:#11120f}.t{font:800 19px Inter,Arial,sans-serif;fill:#11120f}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.sw{font:700 17px Inter,Arial,sans-serif;fill:#fafaf5}</style></defs><rect class="bg" width="1600" height="980"/><text class="k" x="55" y="48">EVENT-TIME FEATURE WINDOWS · ONE PAYMENT, MULTIPLE ATTACK HORIZONS</text><text class="h" x="55" y="96">Freshness is part of the value.</text><g transform="translate(540 530)"><circle cx="0" cy="0" r="360" fill="#efefe9"/><circle cx="0" cy="0" r="285" fill="#dfe4f8"/><circle cx="0" cy="0" r="215" fill="#e7ffc0"/><circle cx="0" cy="0" r="145" fill="#aec0ff"/><circle class="ink" cx="0" cy="0" r="78"/><circle class="ring" cx="0" cy="0" r="360"/><circle class="ring" cx="0" cy="0" r="285"/><circle class="ring" cx="0" cy="0" r="215"/><circle class="ring" cx="0" cy="0" r="145"/><line class="tick" x1="0" y1="-360" x2="0" y2="-385"/><line class="tick" x1="360" y1="0" x2="385" y2="0"/><line class="tick" x1="0" y1="360" x2="0" y2="385"/><line class="tick" x1="-360" y1="0" x2="-385" y2="0"/><text class="sw" x="0" y="-10" text-anchor="middle">PAYMENT</text><text x="0" y="17" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#d9ff63">EVENT TIME T</text><text class="t" x="0" y="-105" text-anchor="middle">1 MINUTE</text><text class="s" x="0" y="-82" text-anchor="middle">card testing burst</text><text class="t" x="0" y="-175" text-anchor="middle">10 MINUTES</text><text class="s" x="0" y="-152" text-anchor="middle">attempt count · decline sequence</text><text class="t" x="0" y="-245" text-anchor="middle">1 HOUR</text><text class="s" x="0" y="-222" text-anchor="middle">amount velocity · country change</text><text class="t" x="0" y="-318" text-anchor="middle">24 HOURS</text><text class="s" x="0" y="-295" text-anchor="middle">accounts/device · merchants/card</text></g><g transform="translate(1010 230)"><rect class="gray" width="500" height="125" rx="8"/><text class="t" x="26" y="39">LONG-TERM PROFILE</text><text class="s" x="26" y="69">account tenure · historical spend · disputes</text><text class="s" x="26" y="96">batch or nearline · hours/day freshness</text><rect class="blue" y="160" width="500" height="125" rx="8"/><text class="t" x="26" y="199">RELATIONAL SNAPSHOT</text><text class="s" x="26" y="229">risky neighbors · component growth · embedding</text><text class="s" x="26" y="256">bounded age · never unbounded request traversal</text><rect class="lime" y="320" width="500" height="125" rx="8"/><text class="t" x="26" y="359">REQUEST CONTEXT</text><text class="s" x="26" y="389">amount · device · session · shipping mismatch</text><text class="s" x="26" y="416">computed now · easiest for attacker to manipulate</text><rect class="ink" y="480" width="500" height="125" rx="8"/><text x="26" y="519" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#fafaf5">EACH VALUE CARRIES</text><text x="26" y="549" font-family="Inter,Arial,sans-serif" font-size="14" fill="#fafaf5">as_of · observed_at · source · default reason</text><text x="26" y="576" font-family="Inter,Arial,sans-serif" font-size="14" fill="#d9ff63">late-event and staleness policy</text></g><text class="s" x="800" y="940" text-anchor="middle">Training reproduces every ring at historical time T; serving rejects or marks values older than their contract.</text></svg>
