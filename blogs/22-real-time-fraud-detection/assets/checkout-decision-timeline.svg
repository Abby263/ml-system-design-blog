<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Checkout fraud decision timeline</title><desc id="desc">Four swimlanes show a payment request, parallel risk features and rules, model and policy decision, authorization response, and asynchronous logging and learning.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#11120f"/></marker><style>.bg{fill:#fafaf5}.ink{fill:#11120f}.blue{fill:#8da8ff}.lime{fill:#d9ff63}.paper{fill:#f0f0ea}.line{stroke:#11120f;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#e84a3a;stroke-width:3;stroke-dasharray:12 9;fill:none}.lane{stroke:#c9cbc2;stroke-width:2}.k{font:700 14px ui-monospace,monospace;letter-spacing:2px;fill:#66695f}.h{font:700 32px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 18px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 18px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.r{font:800 13px ui-monospace,monospace;letter-spacing:1px;fill:#e84a3a}</style></defs><rect class="bg" width="1600" height="900"/><text class="k" x="55" y="48">SYNCHRONOUS AUTHORIZATION · ONE DEADLINE, PARALLEL EVIDENCE</text><text class="h" x="55" y="96">The payment waits for an action—not for the learning loop.</text><line class="lane" x1="220" y1="185" x2="1545" y2="185"/><line class="lane" x1="220" y1="345" x2="1545" y2="345"/><line class="lane" x1="220" y1="590" x2="1545" y2="590"/><line class="lane" x1="220" y1="800" x2="1545" y2="800"/><text class="k" x="55" y="265">PAYMENT</text><text class="k" x="55" y="455">RISK DECISION</text><text class="k" x="55" y="700">ASYNC MEMORY</text><g><rect class="paper" x="250" y="220" width="180" height="80" rx="8"/><text class="t" x="340" y="255" text-anchor="middle">Pay request</text><text class="s" x="340" y="278" text-anchor="middle">idempotency key</text><rect class="ink" x="1320" y="220" width="190" height="80" rx="8"/><text class="tw" x="1415" y="255" text-anchor="middle">Authorize</text><text class="s" x="1415" y="279" text-anchor="middle" fill="#d9ff63">allow · step-up · stop</text></g><g><rect class="paper" x="480" y="390" width="180" height="82" rx="8"/><text class="t" x="570" y="425" text-anchor="middle">Normalize</text><text class="s" x="570" y="449" text-anchor="middle">contract + identity</text><rect class="blue" x="720" y="380" width="205" height="72" rx="8"/><text class="t" x="822" y="411" text-anchor="middle">Feature batch-get</text><text class="s" x="822" y="434" text-anchor="middle">values + freshness</text><rect class="lime" x="720" y="475" width="205" height="72" rx="8"/><text class="t" x="822" y="506" text-anchor="middle">Rules</text><text class="s" x="822" y="529" text-anchor="middle">hard constraints</text><rect class="ink" x="995" y="390" width="180" height="82" rx="8"/><text class="tw" x="1085" y="425" text-anchor="middle">Model</text><text class="s" x="1085" y="449" text-anchor="middle" fill="#fafaf5">calibrated risk</text><rect class="blue" x="1225" y="390" width="190" height="82" rx="8"/><text class="t" x="1320" y="425" text-anchor="middle">Policy</text><text class="s" x="1320" y="449" text-anchor="middle">choose intervention</text></g><path class="line" d="M430 260H570V390"/><path class="line" d="M660 431H720"/><path class="line" d="M660 431C690 431 690 511 720 511"/><path class="line" d="M925 416H995"/><path class="line" d="M925 511C960 511 960 448 995 448"/><path class="line" d="M1175 431H1225"/><path class="line" d="M1320 390V320H1415V300"/><line class="dash" x1="465" y1="160" x2="1420" y2="160"/><text class="r" x="940" y="142" text-anchor="middle">80 MS P99 INTERNAL DEADLINE</text><g><rect class="paper" x="520" y="645" width="205" height="78" rx="8"/><text class="t" x="622" y="678" text-anchor="middle">Decision ledger</text><text class="s" x="622" y="701" text-anchor="middle">immutable evidence</text><rect class="lime" x="795" y="645" width="205" height="78" rx="8"/><text class="t" x="897" y="678" text-anchor="middle">Stream state</text><text class="s" x="897" y="701" text-anchor="middle">velocity + outcomes</text><rect class="blue" x="1070" y="645" width="205" height="78" rx="8"/><text class="t" x="1172" y="678" text-anchor="middle">Cases + labels</text><text class="s" x="1172" y="701" text-anchor="middle">review + disputes</text><rect class="ink" x="1345" y="645" width="165" height="78" rx="8"/><text class="tw" x="1427" y="678" text-anchor="middle">Retrain</text><text class="s" x="1427" y="701" text-anchor="middle" fill="#fafaf5">shadow · canary</text></g><path class="line" d="M1320 472V570H622V645"/><path class="line" d="M725 684H795"/><path class="line" d="M1000 684H1070"/><path class="line" d="M1275 684H1345"/><text class="s" x="800" y="855" text-anchor="middle">The response is bounded; evidence continues through a durable, replayable path.</text></svg>
