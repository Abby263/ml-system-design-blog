<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">01 · CLARIFY THE DECISION, NOT “THE MODEL”</title><desc id="desc">Fraud interview — business actions and deadline define the intelligence boundary</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker><filter id="paper"><feTurbulence baseFrequency=".8" numOctaves="2" seed="7" type="fractalNoise" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter></defs><rect width="1600" height="900" fill="#fffdf6"/><path d="M 35 78 Q 780 71 1565 80" fill="none" stroke="#1f2937" stroke-width="2" opacity=".25"/><text x="45" y="50" fill="#1f2937" font-family="Virgil, Comic Sans MS, cursive" font-size="31" font-weight="700">01 · CLARIFY THE DECISION, NOT “THE MODEL”</text><text x="45" y="82" fill="#53606f" font-family="Virgil, Comic Sans MS, cursive" font-size="18">Fraud interview — business actions and deadline define the intelligence boundary</text><g transform="rotate(-0.7 215 230)"><rect x="55" y="120" width="320" height="220" rx="4" fill="#fef3c7" stroke="#1f2937" stroke-width="2.5"/><path d="M 173 113 h84 v18 h-84z" fill="#ffffff" opacity=".62"/><text x="77" y="160" fill="#1f2937" font-family="Virgil, Comic Sans MS, cursive" font-size="22" font-weight="700">BUSINESS DECISION</text><text x="77" y="194" fill="#1f2937" font-family="Virgil, Comic Sans MS, cursive" font-size="19">Who: payment customer</text><text x="77" y="224" fill="#1f2937" font-family="Virgil, Comic Sans MS, cursive" font-size="19">Protect: money + trust</text><text x="77" y="254" fill="#1f2937" font-family="Virgil, Comic Sans MS, cursive" font-size="19">When: before authorization</text><text x="77" y="284" fill="#1f2937" font-family="Virgil, Comic Sans MS, cursive" font-size="19">Actions: allow · challenge</text><text x="77" y="314" fill="#1f2937" font-family="Virgil, Comic Sans MS, cursive" font-size="19">review · block</text></g>
