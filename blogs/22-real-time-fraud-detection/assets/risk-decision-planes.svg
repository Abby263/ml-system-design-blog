<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">Fraud risk decision planes</title><desc id="desc">Three horizontal lanes separate synchronous fraud decision services, streaming feature memory, and asynchronous training and investigation.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#11120f"/></marker><style>.bg{fill:#fafaf5}.ink{fill:#11120f}.blue{fill:#8da8ff}.lime{fill:#d9ff63}.gray{fill:#efefe9}.lane{fill:none;stroke:#11120f;stroke-width:3}.line{stroke:#11120f;stroke-width:3;fill:none;marker-end:url(#a)}.event{stroke:#526fd6;stroke-width:3;stroke-dasharray:11 8;fill:none;marker-end:url(#a)}.k{font:700 13px ui-monospace,monospace;letter-spacing:2px;fill:#66695f}.h{font:700 32px Inter,Arial,sans-serif;fill:#11120f}.t{font:800 17px Inter,Arial,sans-serif;fill:#11120f}.tw{font:800 17px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}.sw{font:500 13px Inter,Arial,sans-serif;fill:#fafaf5}</style></defs><rect class="bg" width="1600" height="1040"/><text class="k" x="55" y="48">THREE PLANES · ONLY ONE SITS ON THE PAYMENT DEADLINE</text><text class="h" x="55" y="96">Separate deciding, remembering, and learning.</text><rect class="lane" x="55" y="150" width="1490" height="245" rx="10"/><text class="k" x="80" y="182">01 · SYNCHRONOUS DECISION PLANE · &lt;80 MS P99</text><g><rect class="gray" x="100" y="225" width="190" height="95" rx="8"/><text class="t" x="195" y="264" text-anchor="middle">Risk gateway</text><text class="s" x="195" y="290" text-anchor="middle">identity · deadline</text><rect class="blue" x="350" y="225" width="190" height="95" rx="8"/><text class="t" x="445" y="264" text-anchor="middle">Feature view</text><text class="s" x="445" y="290" text-anchor="middle">batch-get + age</text><rect class="lime" x="600" y="225" width="190" height="95" rx="8"/><text class="t" x="695" y="264" text-anchor="middle">Rules</text><text class="s" x="695" y="290" text-anchor="middle">hard controls</text><rect class="ink" x="850" y="225" width="190" height="95" rx="8"/><text class="tw" x="945" y="264" text-anchor="middle">Model</text><text class="sw" x="945" y="290" text-anchor="middle">calibrated score</text><rect class="blue" x="1100" y="225" width="190" height="95" rx="8"/><text class="t" x="1195" y="264" text-anchor="middle">Policy</text><text class="s" x="1195" y="290" text-anchor="middle">action + reasons</text><rect class="ink" x="1350" y="225" width="150" height="95" rx="8"/><text class="tw" x="1425" y="264" text-anchor="middle">Ledger</text><text class="sw" x="1425" y="290" text-anchor="middle">append</text></g><path class="line" d="M290 272H350"/><path class="line" d="M540 250H600"/><path class="line" d="M540 295H600"/><path class="line" d="M790 272H850"/><path class="line" d="M1040 272H1100"/><path class="line" d="M1290 272H1350"/><rect class="lane" x="55" y="440" width="1490" height="230" rx="10"/><text class="k" x="80" y="472">02 · STREAMING MEMORY PLANE · EVENT TIME + REPLAY</text><g><rect class="blue" x="130" y="515" width="210" height="95" rx="8"/><text class="t" x="235" y="554" text-anchor="middle">Canonical log</text><text class="s" x="235" y="580" text-anchor="middle">attempts + outcomes</text><rect class="lime" x="440" y="515" width="230" height="95" rx="8"/><text class="t" x="555" y="554" text-anchor="middle">Stream processor</text><text class="s" x="555" y="580" text-anchor="middle">windows · dedupe</text><rect class="ink" x="770" y="515" width="220" height="95" rx="8"/><text class="tw" x="880" y="554" text-anchor="middle">Online state</text><text class="sw" x="880" y="580" text-anchor="middle">entity feature KV</text><rect class="gray" x="1090" y="515" width="220" height="95" rx="8"/><text class="t" x="1200" y="554" text-anchor="middle">Offline lake</text><text class="s" x="1200" y="580" text-anchor="middle">history + snapshots</text></g><path class="line" d="M340 562H440"/><path class="line" d="M670 562H770"/><path class="line" d="M670 590C720 640 1050 640 1090 590"/><path class="event" d="M1425 320V410H235V515"/><path class="event" d="M880 515V365H445V320"/><rect class="lane" x="55" y="715" width="1490" height="250" rx="10"/><text class="k" x="80" y="747">03 · LEARNING + INVESTIGATION PLANE · DELAYED OUTCOMES</text><g><rect class="gray" x="115" y="800" width="190" height="95" rx="8"/><text class="t" x="210" y="839" text-anchor="middle">Label join</text><text class="s" x="210" y="865" text-anchor="middle">maturity + source</text><rect class="blue" x="365" y="800" width="190" height="95" rx="8"/><text class="t" x="460" y="839" text-anchor="middle">Train + replay</text><text class="s" x="460" y="865" text-anchor="middle">chronological</text><rect class="ink" x="615" y="800" width="190" height="95" rx="8"/><text class="tw" x="710" y="839" text-anchor="middle">Registry</text><text class="sw" x="710" y="865" text-anchor="middle">immutable bundle</text><rect class="lime" x="865" y="800" width="190" height="95" rx="8"/><text class="t" x="960" y="839" text-anchor="middle">Rollout</text><text class="s" x="960" y="865" text-anchor="middle">shadow · canary</text><rect class="blue" x="1115" y="800" width="190" height="95" rx="8"/><text class="t" x="1210" y="839" text-anchor="middle">Case service</text><text class="s" x="1210" y="865" text-anchor="middle">graph + analysts</text><rect class="gray" x="1365" y="800" width="135" height="95" rx="8"/><text class="t" x="1432" y="839" text-anchor="middle">Appeals</text><text class="s" x="1432" y="865" text-anchor="middle">corrections</text></g><path class="line" d="M305 847H365"/><path class="line" d="M555 847H615"/><path class="line" d="M805 847H865"/><path class="line" d="M1305 847H1365"/><path class="event" d="M1200 610V760H1210V800"/><path class="event" d="M960 800V700H945V320"/></svg>
