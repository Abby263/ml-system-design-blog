<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Delayed fraud label chronology</title><desc id="desc">A timeline separates immediate decisions and challenge signals, selected analyst feedback, delayed chargebacks, and a maturity cutoff for legitimate labels.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#11120f"/></marker><style>.bg{fill:#fafaf5}.ink{fill:#11120f}.blue{fill:#8da8ff}.lime{fill:#d9ff63}.gray{fill:#dedfd8}.red{fill:#ef6b5a}.line{stroke:#11120f;stroke-width:4;marker-end:url(#a)}.dash{stroke:#526fd6;stroke-width:3;stroke-dasharray:11 8}.k{font:700 14px ui-monospace,monospace;letter-spacing:2px;fill:#66695f}.h{font:700 32px Inter,Arial,sans-serif;fill:#11120f}.t{font:800 18px Inter,Arial,sans-serif;fill:#11120f}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.sw{font:500 14px Inter,Arial,sans-serif;fill:#fafaf5}.n{font:800 24px Inter,Arial,sans-serif;fill:#11120f}</style></defs><rect class="bg" width="1600" height="900"/><text class="k" x="55" y="48">LABEL CLOCK · FAST FEEDBACK IS NOT THE SAME AS MATURE TRUTH</text><text class="h" x="55" y="96">The policy determines which outcomes can ever become visible.</text><line class="line" x1="130" y1="400" x2="1500" y2="400"/><g><circle class="ink" cx="210" cy="400" r="14"/><text class="n" x="210" y="355" text-anchor="middle">T+0</text><text class="s" x="210" y="450" text-anchor="middle">decision issued</text><circle class="lime" cx="460" cy="400" r="14"/><text class="n" x="460" y="355" text-anchor="middle">SECONDS</text><text class="s" x="460" y="450" text-anchor="middle">challenge pass/fail</text><circle class="blue" cx="745" cy="400" r="14"/><text class="n" x="745" y="355" text-anchor="middle">HOURS–DAYS</text><text class="s" x="745" y="450" text-anchor="middle">selected analyst label</text><circle class="red" cx="1045" cy="400" r="14"/><text class="n" x="1045" y="355" text-anchor="middle">30–90 DAYS</text><text class="s" x="1045" y="450" text-anchor="middle">chargeback/dispute</text><circle class="ink" cx="1370" cy="400" r="14"/><text class="n" x="1370" y="355" text-anchor="middle">MATURITY</text><text class="s" x="1370" y="450" text-anchor="middle">aged non-dispute</text></g><g><rect class="gray" x="110" y="565" width="280" height="125" rx="8"/><text class="t" x="250" y="605" text-anchor="middle">ALLOW</text><text class="s" x="250" y="635" text-anchor="middle">can later dispute</text><text class="s" x="250" y="660" text-anchor="middle">counterfactual still unknown</text><rect class="lime" x="440" y="565" width="280" height="125" rx="8"/><text class="t" x="580" y="605" text-anchor="middle">CHALLENGE</text><text class="s" x="580" y="635" text-anchor="middle">fast intervention signal</text><text class="s" x="580" y="660" text-anchor="middle">not perfect ground truth</text><rect class="blue" x="770" y="565" width="280" height="125" rx="8"/><text class="t" x="910" y="605" text-anchor="middle">REVIEW</text><text class="s" x="910" y="635" text-anchor="middle">high-quality but selected</text><text class="s" x="910" y="660" text-anchor="middle">by the current policy</text><rect class="ink" x="1100" y="565" width="280" height="125" rx="8"/><text x="1240" y="605" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#fafaf5">BLOCK</text><text class="sw" x="1240" y="635" text-anchor="middle">prevents the outcome</text><text class="sw" x="1240" y="660" text-anchor="middle">label is censored</text></g><line class="dash" x1="1370" y1="175" x2="1370" y2="745"/><text class="k" x="1390" y="195">TRAINING CUTOFF</text><text class="s" x="800" y="830" text-anchor="middle">Store provenance, observation time, confidence, and corrections; never promote a model decision into a label.</text></svg>
