<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Append-only fraud decision ledger</title><desc id="desc">An immutable request and decision form a ledger spine, with later intervention, outcome, label, appeal, and correction events appended around it.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#11120f"/></marker><style>.bg{fill:#fafaf5}.ink{fill:#11120f}.blue{fill:#8da8ff}.lime{fill:#d9ff63}.gray{fill:#e5e6df}.red{fill:#ef6b5a}.line{stroke:#11120f;stroke-width:4;fill:none;marker-end:url(#a)}.branch{stroke:#526fd6;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#a)}.k{font:700 14px ui-monospace,monospace;letter-spacing:2px;fill:#66695f}.h{font:700 32px Inter,Arial,sans-serif;fill:#11120f}.t{font:800 17px Inter,Arial,sans-serif;fill:#11120f}.tw{font:800 17px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}.sw{font:500 13px Inter,Arial,sans-serif;fill:#fafaf5}</style></defs><rect class="bg" width="1600" height="900"/><text class="k" x="55" y="48">APPEND-ONLY AUDIT · HISTORY GAINS EVIDENCE, IT DOES NOT CHANGE</text><text class="h" x="55" y="96">Reproduce the decision that was made at T₀.</text><line class="line" x1="135" y1="450" x2="1485" y2="450"/><g><rect class="gray" x="105" y="350" width="205" height="120" rx="8"/><text class="t" x="207" y="392" text-anchor="middle">REQUEST</text><text class="s" x="207" y="420" text-anchor="middle">canonical body hash</text><text class="s" x="207" y="445" text-anchor="middle">event + processing time</text><rect class="ink" x="390" y="330" width="245" height="160" rx="8"/><text class="tw" x="512" y="372" text-anchor="middle">IMMUTABLE DECISION</text><text class="sw" x="512" y="402" text-anchor="middle">action + score + reasons</text><text class="sw" x="512" y="427" text-anchor="middle">feature/model/policy versions</text><text x="512" y="458" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#d9ff63">decision_id = rd_01J...</text><rect class="lime" x="715" y="350" width="205" height="120" rx="8"/><text class="t" x="817" y="392" text-anchor="middle">INTERVENTION</text><text class="s" x="817" y="420" text-anchor="middle">challenge/review result</text><text class="s" x="817" y="445" text-anchor="middle">authorization outcome</text><rect class="blue" x="1000" y="350" width="205" height="120" rx="8"/><text class="t" x="1102" y="392" text-anchor="middle">OUTCOME</text><text class="s" x="1102" y="420" text-anchor="middle">fulfillment · dispute</text><text class="s" x="1102" y="445" text-anchor="middle">observed weeks later</text><rect class="red" x="1285" y="350" width="205" height="120" rx="8"/><text class="t" x="1387" y="392" text-anchor="middle">LABEL</text><text class="s" x="1387" y="420" text-anchor="middle">value + source</text><text class="s" x="1387" y="445" text-anchor="middle">confidence + maturity</text></g><g><rect class="gray" x="360" y="610" width="265" height="110" rx="8"/><text class="t" x="492" y="650" text-anchor="middle">IDEMPOTENT RETRY</text><text class="s" x="492" y="678" text-anchor="middle">same hash returns rd_01J...</text><rect class="blue" x="930" y="610" width="265" height="110" rx="8"/><text class="t" x="1062" y="650" text-anchor="middle">APPEAL</text><text class="s" x="1062" y="678" text-anchor="middle">customer-supplied evidence</text><rect class="lime" x="1250" y="610" width="265" height="110" rx="8"/><text class="t" x="1382" y="650" text-anchor="middle">LABEL CORRECTION</text><text class="s" x="1382" y="678" text-anchor="middle">supersedes label, not decision</text></g><path class="branch" d="M492 610V520H512V490"/><path class="branch" d="M1062 610V470"/><path class="branch" d="M1195 665H1250"/><g transform="translate(330 170)"><rect class="gray" width="1040" height="86" rx="8"/><text class="k" x="25" y="34">REPLAY KEY</text><text class="s" x="25" y="62">request hash + feature snapshot + matched rules + model/calibration + policy + dependency freshness</text></g><text class="s" x="800" y="825" text-anchor="middle">Corrections preserve lineage so training can use current truth while audit can still reconstruct historical knowledge.</text></svg>
