<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">Fraud ring investigation caseboard</title><desc id="desc">A caseboard network connects accounts to shared devices, card tokens, IP ranges, merchants, and a confirmed fraud entity with explanatory notes.</desc><defs><style>.bg{fill:#ebe6dc}.paper{fill:#fafaf5}.ink{fill:#11120f}.blue{fill:#8da8ff}.lime{fill:#d9ff63}.red{fill:#ef6b5a}.edge{stroke:#33352f;stroke-width:4}.risk{stroke:#e84a3a;stroke-width:6}.pin{fill:#11120f}.k{font:700 14px ui-monospace,monospace;letter-spacing:2px;fill:#66695f}.h{font:700 32px Inter,Arial,sans-serif;fill:#11120f}.t{font:800 17px Inter,Arial,sans-serif;fill:#11120f}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}.sw{font:700 15px Inter,Arial,sans-serif;fill:#fafaf5}</style></defs><rect class="bg" width="1600" height="960"/><rect class="paper" x="32" y="30" width="1536" height="900" rx="8"/><text class="k" x="70" y="75">CASE 19-742 · SHARED INFRASTRUCTURE, NOT ONE SUSPICIOUS ROW</text><text class="h" x="70" y="123">Which relationships are expensive for the attacker to replace?</text><g><line class="edge" x1="500" y1="330" x2="760" y2="220"/><line class="edge" x1="500" y1="330" x2="790" y2="470"/><line class="edge" x1="500" y1="330" x2="380" y2="585"/><line class="edge" x1="790" y1="470" x2="1020" y2="330"/><line class="edge" x1="790" y1="470" x2="1040" y2="610"/><line class="edge" x1="760" y1="220" x2="1020" y2="330"/><line class="risk" x1="1040" y1="610" x2="1280" y2="490"/><line class="risk" x1="1020" y1="330" x2="1280" y2="490"/></g><g><circle class="blue" cx="500" cy="330" r="76"/><text class="t" x="500" y="323" text-anchor="middle">ACCOUNT A</text><text class="s" x="500" y="349" text-anchor="middle">2 hours old</text><circle class="lime" cx="760" cy="220" r="68"/><text class="t" x="760" y="213" text-anchor="middle">DEVICE</text><text class="s" x="760" y="239" text-anchor="middle">8 accounts/day</text><circle class="paper" cx="790" cy="470" r="72" stroke="#11120f" stroke-width="3"/><text class="t" x="790" y="463" text-anchor="middle">CARD</text><text class="s" x="790" y="489" text-anchor="middle">12 attempts/10m</text><circle class="blue" cx="380" cy="585" r="70"/><text class="t" x="380" y="578" text-anchor="middle">ACCOUNT B</text><text class="s" x="380" y="604" text-anchor="middle">challenge failed</text><circle class="lime" cx="1020" cy="330" r="72"/><text class="t" x="1020" y="323" text-anchor="middle">IP /24</text><text class="s" x="1020" y="349" text-anchor="middle">carrier-grade NAT?</text><circle class="blue" cx="1040" cy="610" r="72"/><text class="t" x="1040" y="603" text-anchor="middle">MERCHANT</text><text class="s" x="1040" y="629" text-anchor="middle">digital goods</text><circle class="red" cx="1280" cy="490" r="82"/><text class="sw" x="1280" y="482" text-anchor="middle">CONFIRMED</text><text class="sw" x="1280" y="507" text-anchor="middle">FRAUD ACCOUNT</text></g><g transform="translate(80 695) rotate(-2)"><rect class="lime" width="390" height="145"/><circle class="pin" cx="195" cy="14" r="8"/><text class="t" x="24" y="48">STRONGER EVIDENCE</text><text class="s" x="24" y="79">same card + device + timing</text><text class="s" x="24" y="105">edges are recent and repeated</text><text class="s" x="24" y="130">cluster formed before first dispute</text></g><g transform="translate(585 725) rotate(2)"><rect class="blue" width="390" height="145"/><circle class="pin" cx="195" cy="14" r="8"/><text class="t" x="24" y="48">CAUTION</text><text class="s" x="24" y="79">IP ranges and addresses can be shared</text><text class="s" x="24" y="105">cap high-degree neighbor influence</text><text class="s" x="24" y="130">require non-graph corroboration</text></g><g transform="translate(1090 700) rotate(-1)"><rect class="ink" width="390" height="145"/><circle cx="195" cy="14" r="8" fill="#d9ff63"/><text x="24" y="48" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#fafaf5">ONLINE FEATURE SNAPSHOT</text><text x="24" y="79" font-family="Inter,Arial,sans-serif" font-size="13" fill="#fafaf5">risky_neighbors_2hop = 2</text><text x="24" y="105" font-family="Inter,Arial,sans-serif" font-size="13" fill="#fafaf5">component_growth_1h = 7</text><text x="24" y="130" font-family="Inter,Arial,sans-serif" font-size="13" fill="#d9ff63">observed 41 seconds ago</text></g></svg>
