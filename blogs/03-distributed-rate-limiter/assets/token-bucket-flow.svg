<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc"><title id="title">Token bucket decision flow</title><desc id="desc">Flowchart for lazy refill, capacity capping, weighted token spend, retry calculation, and state expiry.</desc><defs><style>.bg{fill:#fafaf5}.n{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.d{fill:#11120f;stroke:#11120f;stroke-width:2}.b{fill:#8da8ff;stroke:#11120f;stroke-width:2}.l{fill:#d9ff63;stroke:#11120f;stroke-width:2}.a{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#x)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 17px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 17px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}.m{font:600 14px ui-monospace,monospace;fill:#11120f}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker></defs><rect width="1500" height="840" class="bg"/><text class="k" x="55" y="48">TOKEN BUCKET · LAZY STATE TRANSITION</text><path class="a" d="M235 395H330M535 395H630M835 395H930M1135 395H1240"/><g transform="translate(55 335)"><rect class="n" width="180" height="120" rx="5"/><text class="t" x="90" y="48" text-anchor="middle">Request</text><text class="s" x="90" y="75" text-anchor="middle">identity + cost</text></g><g transform="translate(330 315)"><rect class="b" width="205" height="160" rx="5"/><text class="t" x="102" y="42" text-anchor="middle">Read state</text><text class="m" x="20" y="82">tokens</text><text class="m" x="20" y="112">updated_ms</text><text class="s" x="20" y="140">missing = full bucket</text></g><g transform="translate(630 290)"><rect class="l" width="205" height="210" rx="5"/><text class="t" x="102" y="42" text-anchor="middle">Lazy refill</text><text class="m" x="20" y="82">elapsed ≥ 0</text><text class="m" x="20" y="115">tokens +=</text><text class="m" x="20" y="140">elapsed × rate</text><text class="s" x="20" y="177">cap at capacity</text></g><g transform="translate(930 315)"><polygon class="n" points="102,0 205,80 102,160 0,80"/><text class="t" x="102" y="70" text-anchor="middle">tokens</text><text class="t" x="102" y="94" text-anchor="middle">≥ cost?</text></g><g transform="translate(1240 215)"><rect class="l" width="205" height="130" rx="5"/><text class="t" x="102" y="45" text-anchor="middle">ALLOW</text><text class="m" x="25" y="78">tokens -= cost</text><text class="s" x="25" y="106">return remaining</text></g><g transform="translate(1240 490)"><rect class="d" width="205" height="130" rx="5"/><text class="tw" x="102" y="45" text-anchor="middle">DENY</text><text class="tw" x="102" y="76" text-anchor="middle">429</text><text class="s" x="102" y="106" text-anchor="middle" fill="#c8cbc2">calculate retry</text></g><path class="a" d="M1032 315V280H1240M1032 475V555H1240"/><text class="k" x="1080" y="267">YES</text><text class="k" x="1080" y="540">NO</text><path class="a" d="M1342 345V405H750V500"/><path class="a" d="M1342 490V430H790V500"/><g transform="translate(610 610)"><rect class="n" width="280" height="120" rx="5"/><text class="t" x="140" y="42" text-anchor="middle">Persist + expire</text><text class="m" x="25" y="78">HSET · PEXPIRE</text><text class="s" x="140" y="103" text-anchor="middle">idle buckets clean themselves</text></g></svg>
