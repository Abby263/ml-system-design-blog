<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc"><title id="title">Distributed rate limiter high-level design</title><desc id="desc">High-level design separating the rate-limit data plane, policy control plane, protected applications, Redis bucket shards, and observability.</desc><defs><style>.bg{fill:#fafaf5}.p{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.n{fill:#fafaf5;stroke:#11120f;stroke-width:2}.d{fill:#11120f}.b{fill:#8da8ff;stroke:#11120f;stroke-width:2}.l{fill:#d9ff63;stroke:#11120f;stroke-width:2}.a{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#x)}.cfg{fill:none;stroke:#4e62a8;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#q)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 25px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 17px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 17px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs><rect width="1500" height="980" class="bg"/><text class="k" x="55" y="48">HIGH-LEVEL DESIGN · ADMISSION DATA PLANE + POLICY CONTROL PLANE</text><g transform="translate(55 85)"><rect class="p" width="1390" height="535" rx="5"/><text class="k" x="25" y="40">REQUEST + DECISION DATA PLANE</text><text class="h" x="25" y="78">Reject early; protect deeper work</text><path class="a" d="M165 280H245M385 280H475M625 280H720M865 220H975M865 340H975M1125 220H1240M1125 340H1240"/><g transform="translate(35 240)"><rect class="n" width="130" height="80" rx="4"/><text class="t" x="65" y="47" text-anchor="middle">Clients</text></g><g transform="translate(245 230)"><rect class="l" width="140" height="100" rx="4"/><text class="t" x="70" y="39" text-anchor="middle">Edge</text><text class="s" x="70" y="63" text-anchor="middle">coarse IP limit</text></g><g transform="translate(475 220)"><rect class="d" width="150" height="120" rx="4"/><text class="tw" x="75" y="43" text-anchor="middle">API Gateway</text><text class="s" x="75" y="70" text-anchor="middle" fill="#c8cbc2">auth + route</text><text class="s" x="75" y="94" text-anchor="middle" fill="#c8cbc2">enforce policy</text></g><g transform="translate(720 180)"><rect class="b" width="145" height="80" rx="4"/><text class="t" x="72" y="37" text-anchor="middle">Limiter A</text><text class="s" x="72" y="59" text-anchor="middle">stateless</text></g><g transform="translate(720 300)"><rect class="b" width="145" height="80" rx="4"/><text class="t" x="72" y="37" text-anchor="middle">Limiter B</text><text class="s" x="72" y="59" text-anchor="middle">stateless</text></g><g transform="translate(975 180)"><rect class="n" width="150" height="80" rx="4"/><text class="t" x="75" y="37" text-anchor="middle">Redis shard 1</text><text class="s" x="75" y="59" text-anchor="middle">atomic buckets</text></g><g transform="translate(975 300)"><rect class="n" width="150" height="80" rx="4"/><text class="t" x="75" y="37" text-anchor="middle">Redis shard N</text><text class="s" x="75" y="59" text-anchor="middle">atomic buckets</text></g><g transform="translate(1240 180)"><rect class="d" width="120" height="80" rx="4"/><text class="tw" x="60" y="47" text-anchor="middle">Service</text></g><g transform="translate(1240 300)"><rect class="l" width="120" height="80" rx="4"/><text class="t" x="60" y="37" text-anchor="middle">Bulkhead</text><text class="s" x="60" y="59" text-anchor="middle">concurrency</text></g><rect class="l" x="475" y="430" width="650" height="65" rx="4"/><text class="t" x="800" y="458" text-anchor="middle">Failure policy lives with each protected operation</text><text class="s" x="800" y="480" text-anchor="middle">cheap read: fail open · scarce work: fail closed · optional local emergency bucket</text></g><g transform="translate(55 675)"><rect class="p" width="1390" height="220" rx="5"/><text class="k" x="25" y="40">POLICY CONTROL + OBSERVABILITY</text><g transform="translate(55 80)"><rect class="d" width="180" height="90" rx="4"/><text class="tw" x="90" y="39" text-anchor="middle">Policy API</text><text class="s" x="90" y="64" text-anchor="middle" fill="#c8cbc2">RBAC · audit</text></g><g transform="translate(345 80)"><rect class="b" width="200" height="90" rx="4"/><text class="t" x="100" y="39" text-anchor="middle">Versioned config</text><text class="s" x="100" y="64" text-anchor="middle">last known good</text></g><g transform="translate(750 80)"><rect class="n" width="210" height="90" rx="4"/><text class="t" x="105" y="39" text-anchor="middle">Metrics + traces</text><text class="s" x="105" y="64" text-anchor="middle">bounded dimensions</text></g><g transform="translate(1100 80)"><rect class="n" width="210" height="90" rx="4"/><text class="t" x="105" y="39" text-anchor="middle">Policy audit log</text><text class="s" x="105" y="64" text-anchor="middle">who changed what</text></g><path class="a" d="M235 125H345M545 125H750M960 125H1100"/></g><path class="cfg" d="M500 755V640H555V425"/><text class="k" x="520" y="655" fill="#4e62a8">CONFIG DISTRIBUTION</text></svg>
