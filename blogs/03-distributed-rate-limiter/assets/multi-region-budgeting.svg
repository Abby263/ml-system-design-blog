<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">Multi-region quota allocation</title><desc id="desc">A global controller leases bounded portions of a global quota to North America, Europe, and Asia for local low-latency decisions.</desc><defs><style>.bg{fill:#fafaf5}.p{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.n{fill:#fafaf5;stroke:#11120f;stroke-width:2}.d{fill:#11120f}.b{fill:#8da8ff;stroke:#11120f;stroke-width:2}.l{fill:#d9ff63;stroke:#11120f;stroke-width:2}.a{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#x)}.lease{fill:none;stroke:#4e62a8;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#q)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 25px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 18px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 18px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.m{font:600 15px ui-monospace,monospace;fill:#11120f}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs><rect width="1500" height="900" class="bg"/><text class="k" x="55" y="48">MULTI-REGION · LEASE BUDGETS, NOT A GLOBAL ROUND TRIP PER REQUEST</text><g transform="translate(500 90)"><rect class="d" width="500" height="175" rx="6"/><text class="tw" x="250" y="47" text-anchor="middle">Global quota controller</text><text class="m" x="250" y="85" text-anchor="middle" fill="#fafaf5">total allowance = 100,000</text><text class="s" x="250" y="120" text-anchor="middle" fill="#c8cbc2">allocates · rebalances · audits outstanding leases</text><text class="s" x="250" y="145" text-anchor="middle" fill="#c8cbc2">not on the regional request path</text></g><path class="lease" d="M750 265V340H260V420M750 340V420M750 340H1240V420"/><g transform="translate(65 420)"><rect class="p" width="390" height="330" rx="5"/><text class="k" x="25" y="38">NORTH AMERICA</text><text class="h" x="25" y="78">50,000 tokens</text><g transform="translate(35 120)"><rect class="b" width="140" height="90" rx="4"/><text class="t" x="70" y="40" text-anchor="middle">Regional</text><text class="t" x="70" y="63" text-anchor="middle">limiter</text></g><g transform="translate(225 120)"><rect class="l" width="130" height="90" rx="4"/><text class="t" x="65" y="40" text-anchor="middle">Local</text><text class="t" x="65" y="63" text-anchor="middle">Redis</text></g><path class="a" d="M175 165H225"/><text class="s" x="25" y="260">Requests decide locally.</text><text class="s" x="25" y="287">Ask for renewal before exhaustion.</text></g><g transform="translate(555 420)"><rect class="p" width="390" height="330" rx="5"/><text class="k" x="25" y="38">EUROPE</text><text class="h" x="25" y="78">30,000 tokens</text><g transform="translate(35 120)"><rect class="b" width="140" height="90" rx="4"/><text class="t" x="70" y="40" text-anchor="middle">Regional</text><text class="t" x="70" y="63" text-anchor="middle">limiter</text></g><g transform="translate(225 120)"><rect class="l" width="130" height="90" rx="4"/><text class="t" x="65" y="40" text-anchor="middle">Local</text><text class="t" x="65" y="63" text-anchor="middle">Redis</text></g><path class="a" d="M175 165H225"/><text class="s" x="25" y="260">Unused budget can be returned.</text><text class="s" x="25" y="287">Lease expiry bounds stranded quota.</text></g><g transform="translate(1045 420)"><rect class="p" width="390" height="330" rx="5"/><text class="k" x="25" y="38">ASIA PACIFIC</text><text class="h" x="25" y="78">20,000 tokens</text><g transform="translate(35 120)"><rect class="b" width="140" height="90" rx="4"/><text class="t" x="70" y="40" text-anchor="middle">Regional</text><text class="t" x="70" y="63" text-anchor="middle">limiter</text></g><g transform="translate(225 120)"><rect class="l" width="130" height="90" rx="4"/><text class="t" x="65" y="40" text-anchor="middle">Local</text><text class="t" x="65" y="63" text-anchor="middle">Redis</text></g><path class="a" d="M175 165H225"/><text class="s" x="25" y="260">Controller outage cannot create</text><text class="s" x="25" y="287">more than the outstanding lease.</text></g><rect class="l" x="350" y="800" width="800" height="60" rx="5"/><text class="t" x="750" y="827" text-anchor="middle">Trade-off: fast local decisions + bounded global error</text><text class="s" x="750" y="849" text-anchor="middle">Precision is limited by lease size and rebalance interval.</text></svg>
