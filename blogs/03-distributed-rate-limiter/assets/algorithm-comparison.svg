<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" role="img" aria-labelledby="title desc"><title id="title">Rate limiting algorithm comparison</title><desc id="desc">Comparison of six rate and concurrency control algorithms.</desc><defs><style>.bg{fill:#fafaf5}.p{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.b{fill:#8da8ff;stroke:#11120f;stroke-width:2}.l{fill:#d9ff63;stroke:#11120f;stroke-width:2}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 22px Inter,Arial,sans-serif;fill:#11120f}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.m{font:600 13px ui-monospace,monospace;fill:#11120f}.line{stroke:#11120f;stroke-width:2}.req{fill:#11120f}</style></defs><rect width="1500" height="960" class="bg"/><text class="k" x="55" y="48">ALGORITHM COMPARISON · SAME RATE, DIFFERENT USER EXPERIENCE</text>
<g transform="translate(55 85)"><rect class="p" width="430" height="350" rx="5"/><text class="h" x="28" y="48">Fixed window</text><text class="s" x="28" y="78">One counter per clock window</text><line class="line" x1="35" y1="160" x2="395" y2="160"/><line class="line" x1="215" y1="125" x2="215" y2="195"/><circle class="req" cx="165" cy="145" r="7"/><circle class="req" cx="185" cy="145" r="7"/><circle class="req" cx="205" cy="145" r="7"/><circle class="req" cx="225" cy="175" r="7"/><circle class="req" cx="245" cy="175" r="7"/><circle class="req" cx="265" cy="175" r="7"/><text class="m" x="28" y="235">state: O(1)</text><text class="m" x="28" y="265">precision: window boundary burst</text><text class="s" x="28" y="310">Best for coarse, explainable quotas.</text></g>
<g transform="translate(535 85)"><rect class="b" width="430" height="350" rx="5"/><text class="h" x="28" y="48">Sliding log</text><text class="s" x="28" y="78">Timestamp every admitted request</text><line class="line" x1="35" y1="160" x2="395" y2="160"/><circle class="req" cx="85" cy="145" r="7"/><circle class="req" cx="140" cy="145" r="7"/><circle class="req" cx="235" cy="145" r="7"/><circle class="req" cx="340" cy="145" r="7"/><path d="M140 195H340" stroke="#11120f" stroke-width="3"/><text class="m" x="28" y="235">state: O(requests in window)</text><text class="m" x="28" y="265">precision: exact</text><text class="s" x="28" y="310">Accurate, expensive at high volume.</text></g>
<g transform="translate(1015 85)"><rect class="p" width="430" height="350" rx="5"/><text class="h" x="28" y="48">Sliding counter</text><text class="s" x="28" y="78">Weight current + previous counters</text><rect x="45" y="125" width="155" height="70" fill="#8da8ff" stroke="#11120f"/><rect x="200" y="125" width="185" height="70" fill="#d9ff63" stroke="#11120f"/><text class="m" x="122" y="167" text-anchor="middle">previous × overlap</text><text class="m" x="292" y="167" text-anchor="middle">current</text><text class="m" x="28" y="235">state: O(1)</text><text class="m" x="28" y="265">precision: approximate</text><text class="s" x="28" y="310">Smooth enough for many API quotas.</text></g>
<g transform="translate(55 500)"><rect class="p" width="430" height="350" rx="5"/><text class="h" x="28" y="48">Leaky bucket</text><text class="s" x="28" y="78">Queue drains at a fixed rate</text><rect x="85" y="125" width="180" height="95" fill="none" stroke="#11120f" stroke-width="3"/><circle class="req" cx="115" cy="190" r="9"/><circle class="req" cx="145" cy="190" r="9"/><circle class="req" cx="175" cy="190" r="9"/><path d="M265 172H375" stroke="#11120f" stroke-width="3"/><text class="m" x="28" y="260">output: smooth</text><text class="m" x="28" y="290">trade-off: queueing latency</text><text class="s" x="28" y="330">Protects a steady downstream worker.</text></g>
<g transform="translate(535 500)"><rect class="l" width="430" height="350" rx="5"/><text class="h" x="28" y="48">Token bucket</text><text class="s" x="28" y="78">Steady refill, bounded burst</text><path d="M110 125V220H310V125" fill="#fafaf5" stroke="#11120f" stroke-width="3"/><circle class="req" cx="145" cy="190" r="11"/><circle class="req" cx="185" cy="190" r="11"/><circle class="req" cx="225" cy="190" r="11"/><circle class="req" cx="265" cy="190" r="11"/><path d="M210 100V145" stroke="#11120f" stroke-width="3"/><text class="m" x="28" y="260">capacity: burst</text><text class="m" x="28" y="290">refill: sustained rate</text><text class="s" x="28" y="330">Chosen for bursty public API traffic.</text></g>
<g transform="translate(1015 500)"><rect class="b" width="430" height="350" rx="5"/><text class="h" x="28" y="48">Concurrency limiter</text><text class="s" x="28" y="78">Bound work currently in flight</text><rect x="65" y="125" width="300" height="85" fill="#fafaf5" stroke="#11120f" stroke-width="2"/><rect x="85" y="145" width="65" height="45" fill="#11120f"/><rect x="165" y="145" width="65" height="45" fill="#11120f"/><rect x="245" y="145" width="65" height="45" fill="#11120f"/><text class="m" x="28" y="260">acquire → work → release</text><text class="m" x="28" y="290">controls latency-dependent load</text><text class="s" x="28" y="330">Complements rate; does not replace it.</text></g></svg>
