<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">Atomic Redis decision sequence</title><desc id="desc">Two API instances race for the final token; Redis serializes Lua execution so only one request is admitted.</desc><defs><style>.bg{fill:#fafaf5}.n{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.d{fill:#11120f}.b{fill:#8da8ff;stroke:#11120f;stroke-width:2}.l{fill:#d9ff63;stroke:#11120f;stroke-width:2}.life{stroke:#aaaDA4;stroke-width:2;stroke-dasharray:7 7}.a{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#x)}.r{fill:none;stroke:#777a70;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#g)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 17px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 17px Inter,Arial,sans-serif;fill:#fafaf5}.m{font:600 14px ui-monospace,monospace;fill:#11120f}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#777a70"/></marker></defs><rect width="1500" height="900" class="bg"/><text class="k" x="55" y="48">SEQUENCE · THE FINAL TOKEN CAN BE SPENT ONCE</text><g transform="translate(90 90)"><rect class="n" width="210" height="70" rx="5"/><text class="t" x="105" y="43" text-anchor="middle">Request A</text></g><g transform="translate(410 90)"><rect class="d" width="210" height="70" rx="5"/><text class="tw" x="105" y="43" text-anchor="middle">API instance 1</text></g><g transform="translate(880 90)"><rect class="d" width="210" height="70" rx="5"/><text class="tw" x="105" y="43" text-anchor="middle">API instance 2</text></g><g transform="translate(1200 90)"><rect class="b" width="210" height="70" rx="5"/><text class="t" x="105" y="43" text-anchor="middle">Redis</text></g><line class="life" x1="195" y1="160" x2="195" y2="830"/><line class="life" x1="515" y1="160" x2="515" y2="830"/><line class="life" x1="985" y1="160" x2="985" y2="830"/><line class="life" x1="1305" y1="160" x2="1305" y2="830"/><g transform="translate(625 90)"><rect class="n" width="150" height="70" rx="5"/><text class="t" x="75" y="43" text-anchor="middle">Request B</text></g><line class="life" x1="700" y1="160" x2="700" y2="830"/><path class="a" d="M195 235H515"/><text class="m" x="270" y="222">same identity</text><path class="a" d="M700 285H985"/><text class="m" x="755" y="272">same identity</text><path class="a" d="M515 350H1305"/><text class="m" x="750" y="337">EVALSHA bucket transition</text><rect class="l" x="1165" y="390" width="280" height="180" rx="5"/><text class="t" x="1305" y="425" text-anchor="middle">Atomic script A</text><text class="m" x="1190" y="462">TIME</text><text class="m" x="1190" y="492">refill → 1 token</text><text class="m" x="1190" y="522">spend → 0 tokens</text><text class="m" x="1190" y="552">persist</text><path class="r" d="M1305 600H515"/><text class="m" x="760" y="587">ALLOW · remaining=0</text><path class="a" d="M985 650H1305"/><text class="m" x="1030" y="637">EVALSHA after A</text><rect class="n" x="1165" y="680" width="280" height="105" rx="5"/><text class="t" x="1305" y="715" text-anchor="middle">Atomic script B</text><text class="m" x="1190" y="750">0 tokens → DENY</text><path class="r" d="M1305 810H985"/><text class="m" x="1040" y="797">DENY · retry=1s</text></svg>
