<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc"><title id="title">Distributed rate limiter problem map</title><desc id="desc">Mind map of policy, identity, algorithms, consistency, failure behavior, and operations.</desc><defs><style>.bg{fill:#fafaf5}.n{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.d{fill:#11120f}.b{fill:#8da8ff;stroke:#11120f;stroke-width:2}.l{fill:#d9ff63;stroke:#11120f;stroke-width:2}.x{fill:none;stroke:#777a70;stroke-width:2.5}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 19px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 24px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.sw{font:500 14px Inter,Arial,sans-serif;fill:#c8cbc2}</style></defs><rect width="1500" height="920" class="bg"/><text class="k" x="55" y="48">PROBLEM MAP · “100 REQUESTS / MINUTE” IS NOT YET A POLICY</text><path class="x" d="M750 455C580 455 560 190 430 190M750 455H430M750 455C580 455 560 720 430 720M750 455C920 455 940 190 1070 190M750 455H1070M750 455C920 455 940 720 1070 720"/><g transform="translate(575 360)"><rect class="d" width="350" height="190" rx="8"/><text class="tw" x="175" y="70" text-anchor="middle">Admission decision</text><text class="sw" x="175" y="108" text-anchor="middle">identity + policy + state</text><text class="sw" x="175" y="136" text-anchor="middle">→ allow or deny</text></g><g transform="translate(65 105)"><rect class="l" width="365" height="170" rx="5"/><text class="t" x="25" y="40">POLICY</text><text class="s" x="25" y="75">capacity · sustained rate · cost</text><text class="s" x="25" y="103">burst tolerance · reset semantics</text><text class="s" x="25" y="131">route · tier · emergency override</text></g><g transform="translate(65 370)"><rect class="n" width="365" height="170" rx="5"/><text class="t" x="25" y="40">IDENTITY</text><text class="s" x="25" y="75">IP · user · API key · tenant</text><text class="s" x="25" y="103">global + hierarchical partitions</text><text class="s" x="25" y="131">trusted proxy and auth boundary</text></g><g transform="translate(65 635)"><rect class="b" width="365" height="170" rx="5"/><text class="t" x="25" y="40">ALGORITHM</text><text class="s" x="25" y="75">fixed / sliding window</text><text class="s" x="25" y="103">token / leaky bucket</text><text class="s" x="25" y="131">rate versus concurrency</text></g><g transform="translate(1070 105)"><rect class="b" width="365" height="170" rx="5"/><text class="t" x="25" y="40">CONSISTENCY</text><text class="s" x="25" y="75">atomic spend · clock authority</text><text class="s" x="25" y="103">regional versus global quota</text><text class="s" x="25" y="131">bounded oversubscription</text></g><g transform="translate(1070 370)"><rect class="l" width="365" height="170" rx="5"/><text class="t" x="25" y="40">FAILURE</text><text class="s" x="25" y="75">fail open · fail closed</text><text class="s" x="25" y="103">local emergency bucket</text><text class="s" x="25" y="131">retry storms · load shedding</text></g><g transform="translate(1070 635)"><rect class="n" width="365" height="170" rx="5"/><text class="t" x="25" y="40">OPERATIONS</text><text class="s" x="25" y="75">hot keys · shard saturation</text><text class="s" x="25" y="103">policy rollout · audit history</text><text class="s" x="25" y="131">latency · denials · bypasses</text></g></svg>
