services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      IDENTITY_SECRET: replace-me-outside-local-development
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
