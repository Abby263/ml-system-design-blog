<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Designing ML Systems series roadmap</title>
  <desc id="desc">A five-stage roadmap progressing from software foundations through distributed systems, ML systems, generative AI systems, and AI platform architecture.</desc>
  <defs>
    <style>
      .bg{fill:#fafaf5}.grid{stroke:#11120f;stroke-opacity:.05}.stage{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.current{fill:#d9ff63;stroke:#11120f;stroke-width:2}.advanced{fill:#8da8ff;stroke:#11120f;stroke-width:2}.cap{fill:#11120f;stroke:#11120f;stroke-width:2}.line{fill:none;stroke:#11120f;stroke-width:3;marker-end:url(#arrow)}.k{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#777a70}.n{font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#11120f}.h{font:700 24px Inter,Arial,sans-serif;fill:#11120f}.hw{font:700 24px Inter,Arial,sans-serif;fill:#fafaf5}.p{font:500 15px Inter,Arial,sans-serif;fill:#55584f}.pw{font:500 15px Inter,Arial,sans-serif;fill:#b7bab1}.tag{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#11120f}
    </style>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" class="grid" fill="none"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker>
  </defs>
  <rect width="1500" height="720" class="bg"/><rect width="1500" height="720" fill="url(#grid)"/>
  <text class="k" x="55" y="48">SERIES ROADMAP · EACH STAGE REUSES THE SYSTEMS THINKING BELOW IT</text>
  <path class="line" d="M305 340H335M585 340h30M865 340h30M1145 340h30"/>

  <g transform="translate(55 170)"><rect class="current" width="250" height="340" rx="4"/><text class="n" x="24" y="38">STAGE 01</text><text class="h" x="24" y="86">Software</text><text class="h" x="24" y="114">foundations</text><line x1="24" y1="142" x2="226" y2="142" stroke="#11120f" stroke-opacity=".25"/><text class="p" x="24" y="178">APIs + data models</text><text class="p" x="24" y="208">Caching + queues</text><text class="p" x="24" y="238">Concurrency</text><text class="p" x="24" y="268">Reliability</text><rect x="24" y="298" width="118" height="26" fill="#11120f"/><text class="tag" x="83" y="316" text-anchor="middle" fill="#fafaf5">START HERE</text></g>
  <g transform="translate(335 170)"><rect class="stage" width="250" height="340" rx="4"/><text class="n" x="24" y="38">STAGE 02</text><text class="h" x="24" y="86">Distributed</text><text class="h" x="24" y="114">systems</text><line x1="24" y1="142" x2="226" y2="142" stroke="#11120f" stroke-opacity=".2"/><text class="p" x="24" y="178">Partitioning</text><text class="p" x="24" y="208">Replication</text><text class="p" x="24" y="238">Coordination</text><text class="p" x="24" y="268">Multi-region</text></g>
  <g transform="translate(615 170)"><rect class="stage" width="250" height="340" rx="4"/><text class="n" x="24" y="38">STAGE 03</text><text class="h" x="24" y="86">ML system</text><text class="h" x="24" y="114">design</text><line x1="24" y1="142" x2="226" y2="142" stroke="#11120f" stroke-opacity=".2"/><text class="p" x="24" y="178">Feature pipelines</text><text class="p" x="24" y="208">Training platforms</text><text class="p" x="24" y="238">Model serving</text><text class="p" x="24" y="268">Drift + evaluation</text></g>
  <g transform="translate(895 170)"><rect class="advanced" width="250" height="340" rx="4"/><text class="n" x="24" y="38">STAGE 04</text><text class="h" x="24" y="86">Generative</text><text class="h" x="24" y="114">AI systems</text><line x1="24" y1="142" x2="226" y2="142" stroke="#11120f" stroke-opacity=".25"/><text class="p" x="24" y="178">RAG + retrieval</text><text class="p" x="24" y="208">LLM inference</text><text class="p" x="24" y="238">Gateways + agents</text><text class="p" x="24" y="268">Tenant isolation</text></g>
  <g transform="translate(1175 170)"><rect class="cap" width="270" height="340" rx="4"/><text class="n" x="24" y="38" fill="#d9ff63">STAGE 05</text><text class="hw" x="24" y="86">AI platform</text><text class="hw" x="24" y="114">architecture</text><line x1="24" y1="142" x2="246" y2="142" stroke="#fff" stroke-opacity=".2"/><text class="pw" x="24" y="178">Control planes</text><text class="pw" x="24" y="208">Governance</text><text class="pw" x="24" y="238">Global serving</text><text class="pw" x="24" y="268">Cost + security</text><rect x="24" y="298" width="118" height="26" fill="#d9ff63"/><text class="tag" x="83" y="316" text-anchor="middle">CAPSTONE</text></g>

  <path d="M180 560H1310" stroke="#11120f" stroke-width="2"/><circle cx="180" cy="560" r="8" fill="#d9ff63" stroke="#11120f" stroke-width="2"/><circle cx="462" cy="560" r="7" fill="#fafaf5" stroke="#11120f" stroke-width="2"/><circle cx="740" cy="560" r="7" fill="#fafaf5" stroke="#11120f" stroke-width="2"/><circle cx="1020" cy="560" r="7" fill="#8da8ff" stroke="#11120f" stroke-width="2"/><circle cx="1310" cy="560" r="8" fill="#11120f" stroke="#11120f" stroke-width="2"/>
  <text class="k" x="180" y="605" text-anchor="middle">ONE SERVICE</text><text class="k" x="1310" y="605" text-anchor="middle">GLOBAL AI PLATFORM</text>
  <text class="p" x="750" y="665" text-anchor="middle">The vocabulary changes. The core questions—state, scale, failure, latency, and trade-offs—do not.</text>
</svg>
