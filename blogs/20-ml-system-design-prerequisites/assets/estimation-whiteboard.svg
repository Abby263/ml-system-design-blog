<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Back-of-the-envelope estimation whiteboard</title>
  <desc id="desc">Traffic, event storage, concurrency, replica count, and latency budget calculations drive architecture choices.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe1e8" stroke-width="1"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#fffdf6"/>
  <rect x="18" y="18" width="1364" height="784" rx="18" fill="none" stroke="#172033" stroke-width="2"/>
  <text x="55" y="78" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800"><tspan x="55" dy="0">ESTIMATE UNTIL A NUMBER CHANGES THE DESIGN</tspan></text><text x="55" y="112" text-anchor="start" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="55" dy="0">Write assumptions beside results so the interviewer can change either.</tspan></text><g><rect x="55" y="155" width="270" height="195" rx="14" fill="#dbeafe" stroke="#172033" stroke-width="2" /><text x="190" y="187" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="190" dy="0">TRAFFIC</tspan></text><text x="190" y="224.6" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="190" dy="0">100M decisions/day</tspan><tspan x="190" dy="21.76">÷ 86,400 = 1,157 avg RPS</tspan><tspan x="190" dy="21.76">× 5 peak = 5,800 RPS</tspan></text></g><g><rect x="365" y="155" width="270" height="195" rx="14" fill="#dcfce7" stroke="#172033" stroke-width="2" /><text x="500" y="187" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="500" dy="0">EVENTS</tspan></text><text x="500" y="224.6" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="500" dy="0">100M × 3 KB</tspan><tspan x="500" dy="21.76">≈ 300 GB/day</tspan><tspan x="500" dy="21.76">before replicas + indexes</tspan></text></g><g><rect x="675" y="155" width="270" height="195" rx="14" fill="#fef3c7" stroke="#172033" stroke-width="2" /><text x="810" y="187" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="810" dy="0">CONCURRENCY</tspan></text><text x="810" y="224.6" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="810" dy="0">5,800 RPS × 0.040 s</tspan><tspan x="810" dy="21.76">≈ 232 requests</tspan><tspan x="810" dy="21.76">in flight</tspan></text></g><g><rect x="985" y="155" width="270" height="195" rx="14" fill="#ede9fe" stroke="#172033" stroke-width="2" /><text x="1120" y="187" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="1120" dy="0">REPLICAS</tspan></text><text x="1120" y="224.6" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="1120" dy="0">5,800 ÷ 250 safe RPS</tspan><tspan x="1120" dy="21.76">× headroom</tspan><tspan x="1120" dy="21.76">≈ 24 replicas</tspan></text></g><path d="M325 253 L365 253" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M635 253 L675 253" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M945 253 L985 253" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="75" y="485" text-anchor="start" fill="#b91c1c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800"><tspan x="75" dy="0">80 MS INTERNAL DECISION BUDGET</tspan></text><g><rect x="75" y="535" width="85" height="90" fill="#dbeafe" stroke="#172033" stroke-width="2"/><text x="117.5" y="573" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800"><tspan x="117.5" dy="0">5 ms</tspan></text><text x="117.5" y="602" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600"><tspan x="117.5" dy="0">validate</tspan></text></g><g><rect x="160" y="535" width="280" height="90" fill="#dcfce7" stroke="#172033" stroke-width="2"/><text x="300" y="573" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800"><tspan x="300" dy="0">20 ms</tspan></text><text x="300" y="602" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600"><tspan x="300" dy="0">features</tspan></text></g><g><rect x="440" y="535" width="140" height="90" fill="#fef3c7" stroke="#172033" stroke-width="2"/><text x="510" y="573" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800"><tspan x="510" dy="0">10 ms</tspan></text><text x="510" y="602" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600"><tspan x="510" dy="0">rules</tspan></text></g><g><rect x="580" y="535" width="210" height="90" fill="#ede9fe" stroke="#172033" stroke-width="2"/><text x="685" y="573" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800"><tspan x="685" dy="0">15 ms</tspan></text><text x="685" y="602" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600"><tspan x="685" dy="0">model</tspan></text></g><g><rect x="790" y="535" width="140" height="90" fill="#ffedd5" stroke="#172033" stroke-width="2"/><text x="860" y="573" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800"><tspan x="860" dy="0">10 ms</tspan></text><text x="860" y="602" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600"><tspan x="860" dy="0">ledger</tspan></text></g><g><rect x="930" y="535" width="345" height="90" fill="#fce7f3" stroke="#172033" stroke-width="2"/><text x="1102.5" y="573" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800"><tspan x="1102.5" dy="0">20 ms</tspan></text><text x="1102.5" y="602" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600"><tspan x="1102.5" dy="0">network + tail reserve</tspan></text></g><text x="75" y="685" text-anchor="start" fill="#b91c1c" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="75" dy="0">Forces: batch feature reads · preloaded model · child deadlines · explicit reserve</tspan></text>
</svg>
