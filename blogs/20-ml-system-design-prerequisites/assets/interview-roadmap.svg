<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">ML system design interview roadmap</title>
  <desc id="desc">A sixty-minute sequence maps the canonical headings to five interview phases.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe1e8" stroke-width="1"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#fffdf6"/>
  <rect x="18" y="18" width="1364" height="784" rx="18" fill="none" stroke="#172033" stroke-width="2"/>
  <text x="55" y="78" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800"><tspan x="55" dy="0">THE CANONICAL TEMPLATE IS ALSO A CLOCK</tspan></text><text x="55" y="112" text-anchor="start" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="55" dy="0">Spend the most time where requirements create a real trade-off.</tspan></text><g><rect x="55" y="155" width="245" height="145" rx="14" fill="#fef3c7" stroke="#172033" stroke-width="2" /><text x="177.5" y="187" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750"><tspan x="177.5" dy="0">1 · CONTRACT</tspan></text><text x="177.5" y="223.32" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="177.5" dy="0">decision · scope</tspan><tspan x="177.5" dy="20.48">FR / NFR</tspan></text></g><text x="177.5" y="133" text-anchor="middle" fill="#596579" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600"><tspan x="177.5" dy="0">0–8 min</tspan></text><g><rect x="330" y="155" width="245" height="145" rx="14" fill="#dbeafe" stroke="#172033" stroke-width="2" /><text x="452.5" y="187" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750"><tspan x="452.5" dy="0">2 · MEASURE</tspan></text><text x="452.5" y="223.32" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="452.5" dy="0">metrics · scale</tspan><tspan x="452.5" dy="20.48">latency budget</tspan></text></g><text x="452.5" y="133" text-anchor="middle" fill="#596579" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600"><tspan x="452.5" dy="0">8–15 min</tspan></text><g><rect x="605" y="155" width="245" height="145" rx="14" fill="#dcfce7" stroke="#172033" stroke-width="2" /><text x="727.5" y="187" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750"><tspan x="727.5" dy="0">3 · HLD V0</tspan></text><text x="727.5" y="223.32" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="727.5" dy="0">smallest full loop</tspan><tspan x="727.5" dy="20.48">baseline first</tspan></text></g><text x="727.5" y="133" text-anchor="middle" fill="#596579" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600"><tspan x="727.5" dy="0">15–25 min</tspan></text><g><rect x="880" y="155" width="245" height="145" rx="14" fill="#ede9fe" stroke="#172033" stroke-width="2" /><text x="1002.5" y="187" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750"><tspan x="1002.5" dy="0">4 · DEEP DIVE</tspan></text><text x="1002.5" y="223.32" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="1002.5" dy="0">data · model</tspan><tspan x="1002.5" dy="20.48">serving path</tspan></text></g><text x="1002.5" y="133" text-anchor="middle" fill="#596579" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600"><tspan x="1002.5" dy="0">25–43 min</tspan></text><g><rect x="1155" y="155" width="190" height="145" rx="14" fill="#fce7f3" stroke="#172033" stroke-width="2" /><text x="1250" y="187" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750"><tspan x="1250" dy="0">5 · PROVE</tspan></text><text x="1250" y="223.32" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="1250" dy="0">failure · release</tspan><tspan x="1250" dy="20.48">summary</tspan></text></g><text x="1250" y="133" text-anchor="middle" fill="#596579" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600"><tspan x="1250" dy="0">43–60 min</tspan></text><path d="M300 228 L330 228" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M575 228 L605 228" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M850 228 L880 228" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M1125 228 L1155 228" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="70" y="375" text-anchor="start" fill="#596579" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="750"><tspan x="70" dy="0">CANONICAL H2 SPINE</tspan></text><g><rect x="70" y="410" width="185" height="165" rx="14" fill="#fef3c7" stroke="#172033" stroke-width="2" /><text x="162.5" y="442" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="162.5" dy="0">Prompt</tspan></text><text x="162.5" y="477.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="162.5" dy="0">Business + scope</tspan><tspan x="162.5" dy="19.2">FR / NFR</tspan></text></g><g><rect x="290" y="410" width="185" height="165" rx="14" fill="#dbeafe" stroke="#172033" stroke-width="2" /><text x="382.5" y="442" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="382.5" dy="0">Intelligence</tspan></text><text x="382.5" y="477.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="382.5" dy="0">Success metrics</tspan><tspan x="382.5" dy="19.2">Estimation</tspan></text></g><g><rect x="510" y="410" width="185" height="165" rx="14" fill="#dcfce7" stroke="#172033" stroke-width="2" /><text x="602.5" y="442" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="602.5" dy="0">HLD V0</tspan></text><text x="602.5" y="477.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="602.5" dy="0">Evolution</tspan><tspan x="602.5" dy="19.2">Data + labels</tspan></text></g><g><rect x="730" y="410" width="185" height="165" rx="14" fill="#ede9fe" stroke="#172033" stroke-width="2" /><text x="822.5" y="442" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="822.5" dy="0">Features + models</tspan></text><text x="822.5" y="477.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="822.5" dy="0">Online path</tspan><tspan x="822.5" dy="19.2">Reliability</tspan></text></g><g><rect x="950" y="410" width="185" height="165" rx="14" fill="#fce7f3" stroke="#172033" stroke-width="2" /><text x="1042.5" y="442" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="1042.5" dy="0">LLD</tspan></text><text x="1042.5" y="477.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="1042.5" dy="0">Final board</tspan><tspan x="1042.5" dy="19.2">References + next</tspan></text></g><g><rect x="1160" y="410" width="180" height="165" rx="14" fill="#ffedd5" stroke="#172033" stroke-width="2" /><text x="1250" y="442" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="1250" dy="0">FOLLOW-UPS</tspan></text><text x="1250" y="477.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="1250" dy="0">Why this model?</tspan><tspan x="1250" dy="19.2">Why synchronous?</tspan><tspan x="1250" dy="19.2">What fails?</tspan></text></g><text x="700" y="690" text-anchor="middle" fill="#b91c1c" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700"><tspan x="700" dy="0">The board should evolve; do not erase the assumptions that earned each box.</tspan></text>
</svg>
