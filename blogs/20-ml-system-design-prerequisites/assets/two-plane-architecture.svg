<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Synchronous prediction path and asynchronous learning plane</title>
  <desc id="desc">The bounded online decision path is separated from replayable data, training, registry, rollout, and feedback workflows.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe1e8" stroke-width="1"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#fffdf6"/>
  <rect x="18" y="18" width="1364" height="784" rx="18" fill="none" stroke="#172033" stroke-width="2"/>
  <text x="55" y="78" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800"><tspan x="55" dy="0">TWO PLANES, TWO FAILURE CONTRACTS</tspan></text><text x="55" y="112" text-anchor="start" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="55" dy="0">Solid arrows spend the caller’s deadline. Dashed arrows improve a future decision.</tspan></text><text x="55" y="136" text-anchor="start" fill="#b91c1c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800"><tspan x="55" dy="0">SYNC · CALLER WAITS</tspan></text><g><rect x="55" y="150" width="160" height="115" rx="14" fill="#fffdf6" stroke="#172033" stroke-width="2" /><text x="135" y="182" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750"><tspan x="135" dy="0">Request</tspan></text><text x="135" y="218.32" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="135" dy="0">deadline</tspan></text></g><g><rect x="275" y="150" width="245" height="115" rx="14" fill="#dbeafe" stroke="#172033" stroke-width="2" /><text x="397.5" y="182" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750"><tspan x="397.5" dy="0">Decision service</tspan></text><text x="397.5" y="218.32" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="397.5" dy="0">validate · orchestrate</tspan></text></g><g><rect x="580" y="150" width="210" height="115" rx="14" fill="#dcfce7" stroke="#172033" stroke-width="2" /><text x="685" y="182" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750"><tspan x="685" dy="0">Online features</tspan></text><text x="685" y="218.32" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="685" dy="0">batch-get · freshness</tspan></text></g><g><rect x="850" y="150" width="190" height="115" rx="14" fill="#ede9fe" stroke="#172033" stroke-width="2" /><text x="945" y="182" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750"><tspan x="945" dy="0">Model</tspan></text><text x="945" y="218.32" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="945" dy="0">preloaded artifact</tspan></text></g><g><rect x="1100" y="150" width="210" height="115" rx="14" fill="#fef3c7" stroke="#172033" stroke-width="2" /><text x="1205" y="182" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750"><tspan x="1205" dy="0">Policy + response</tspan></text><text x="1205" y="218.32" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="1205" dy="0">constraints · action</tspan></text></g><path d="M215 207 L275 207" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M520 207 L580 207" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M790 207 L850 207" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M1040 207 L1100 207" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="55" y="480" text-anchor="start" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800"><tspan x="55" dy="0">ASYNC · DURABLE, RETRYABLE, IDEMPOTENT</tspan></text><g><rect x="55" y="510" width="195" height="115" rx="14" fill="#dbeafe" stroke="#172033" stroke-width="2" /><text x="152.5" y="542" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="152.5" dy="0">Event log</tspan></text><text x="152.5" y="577.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500"><tspan x="152.5" dy="0">durable + replayable</tspan></text></g><g><rect x="300" y="510" width="195" height="115" rx="14" fill="#dcfce7" stroke="#172033" stroke-width="2" /><text x="397.5" y="542" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="397.5" dy="0">Point-in-time data</tspan></text><text x="397.5" y="577.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500"><tspan x="397.5" dy="0">backfill + validate</tspan></text></g><g><rect x="545" y="510" width="195" height="115" rx="14" fill="#ede9fe" stroke="#172033" stroke-width="2" /><text x="642.5" y="542" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="642.5" dy="0">Train + evaluate</tspan></text><text x="642.5" y="577.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500"><tspan x="642.5" dy="0">baseline + slices</tspan></text></g><g><rect x="790" y="510" width="195" height="115" rx="14" fill="#ffedd5" stroke="#172033" stroke-width="2" /><text x="887.5" y="542" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="887.5" dy="0">Registry</tspan></text><text x="887.5" y="577.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500"><tspan x="887.5" dy="0">lineage + compatibility</tspan></text></g><g><rect x="1035" y="510" width="195" height="115" rx="14" fill="#fef3c7" stroke="#172033" stroke-width="2" /><text x="1132.5" y="542" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="1132.5" dy="0">Rollout control</tspan></text><text x="1132.5" y="577.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500"><tspan x="1132.5" dy="0">shadow · canary</tspan></text></g><g><rect x="1260" y="510" width="90" height="115" rx="14" fill="#fce7f3" stroke="#172033" stroke-width="2" /><text x="1305" y="542" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750"><tspan x="1305" dy="0">Next</tspan></text><text x="1305" y="577.04" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500"><tspan x="1305" dy="0">bundle</tspan></text></g><path d="M250 567 L300 567" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><path d="M495 567 L545 567" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><path d="M740 567 L790 567" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><path d="M985 567 L1035 567" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><path d="M1230 567 L1260 567" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><path d="M1205 265V455H152V510" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text x="865" y="447" text-anchor="middle" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700"><tspan x="865" dy="0">decision + exposure</tspan></text><path d="M1140 510V445H1035L945 265" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text x="1115" y="395" text-anchor="middle" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700"><tspan x="1115" dy="0">immutable bundle</tspan></text><g><rect x="430" y="335" width="540" height="90" rx="14" fill="#fffdf6" stroke="#b91c1c" stroke-width="2" stroke-dasharray="9 7"/><text x="700" y="367" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="700" dy="0">Control-plane outage must not stop a healthy prediction path</tspan></text><text x="700" y="404.6" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="700" dy="0">Serve the last-known-good compatible bundle.</tspan></text></g>
</svg>
