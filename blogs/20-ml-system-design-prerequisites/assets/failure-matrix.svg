<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">ML failure and recovery matrix</title>
  <desc id="desc">A matrix maps feature, model, stream, label, and regional failures to detection, safe behavior, and recovery evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe1e8" stroke-width="1"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#fffdf6"/>
  <rect x="18" y="18" width="1364" height="784" rx="18" fill="none" stroke="#172033" stroke-width="2"/>
  <text x="55" y="78" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800"><tspan x="55" dy="0">A FALLBACK IS INCOMPLETE WITHOUT RECOVERY EVIDENCE</tspan></text><text x="55" y="112" text-anchor="start" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="55" dy="0">Monitor software health, data health, and decision health together.</tspan></text><rect x="55" y="145" width="185" height="70" fill="#172033"/><text x="73" y="188" text-anchor="start" fill="#fffdf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800"><tspan x="73" dy="0">DEPENDENCY</tspan></text><rect x="240" y="145" width="285" height="70" fill="#172033"/><text x="258" y="188" text-anchor="start" fill="#fffdf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800"><tspan x="258" dy="0">DETECT</tspan></text><rect x="525" y="145" width="350" height="70" fill="#172033"/><text x="543" y="188" text-anchor="start" fill="#fffdf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800"><tspan x="543" dy="0">SAFE BEHAVIOR</tspan></text><rect x="875" y="145" width="470" height="70" fill="#172033"/><text x="893" y="188" text-anchor="start" fill="#fffdf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800"><tspan x="893" dy="0">RECOVERY PROOF</tspan></text><rect x="55" y="215" width="185" height="105" fill="#dcfce7" stroke="#172033" stroke-width="1.5"/><text x="74" y="275" text-anchor="start" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800"><tspan x="74" dy="0">FEATURES</tspan></text><rect x="240" y="215" width="285" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="258" y="275" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="258" dy="0">freshness / timeout</tspan></text><rect x="525" y="215" width="350" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="543" y="275" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="543" dy="0">default or smaller model</tspan></text><rect x="875" y="215" width="470" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="893" y="275" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="893" dy="0">parity + age recover</tspan></text><rect x="55" y="320" width="185" height="105" fill="#ede9fe" stroke="#172033" stroke-width="1.5"/><text x="74" y="380" text-anchor="start" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800"><tspan x="74" dy="0">MODEL</tspan></text><rect x="240" y="320" width="285" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="258" y="380" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="258" dy="0">load / schema error</tspan></text><rect x="525" y="320" width="350" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="543" y="380" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="543" dy="0">last-known-good</tspan></text><rect x="875" y="320" width="470" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="893" y="380" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="893" dy="0">shadow + checksum</tspan></text><rect x="55" y="425" width="185" height="105" fill="#dbeafe" stroke="#172033" stroke-width="1.5"/><text x="74" y="485" text-anchor="start" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800"><tspan x="74" dy="0">STREAM</tspan></text><rect x="240" y="425" width="285" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="258" y="485" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="258" dy="0">lag / hot partition</tspan></text><rect x="525" y="425" width="350" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="543" y="485" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="543" dy="0">bounded stale state</tspan></text><rect x="875" y="425" width="470" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="893" y="485" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="893" dy="0">drain without duplicates</tspan></text><rect x="55" y="530" width="185" height="105" fill="#fce7f3" stroke="#172033" stroke-width="1.5"/><text x="74" y="590" text-anchor="start" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800"><tspan x="74" dy="0">LABELS</tspan></text><rect x="240" y="530" width="285" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="258" y="590" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="258" dy="0">source / rate shift</tspan></text><rect x="525" y="530" width="350" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="543" y="590" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="543" dy="0">pause promotion</tspan></text><rect x="875" y="530" width="470" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="893" y="590" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="893" dy="0">mature cohort audit</tspan></text><rect x="55" y="635" width="185" height="105" fill="#ffedd5" stroke="#172033" stroke-width="1.5"/><text x="74" y="695" text-anchor="start" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800"><tspan x="74" dy="0">REGION</tspan></text><rect x="240" y="635" width="285" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="258" y="695" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="258" dy="0">health / RTO breach</tspan></text><rect x="525" y="635" width="350" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="543" y="695" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="543" dy="0">allowed healthy cell</tspan></text><rect x="875" y="635" width="470" height="105" fill="#fffdf6" stroke="#172033" stroke-width="1.5"/><text x="893" y="695" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600"><tspan x="893" dy="0">replay + residency proof</tspan></text><text x="700" y="776" text-anchor="middle" fill="#b91c1c" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="700" dy="0">Never turn missing or stale evidence silently into a valid zero.</tspan></text>
</svg>
