<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">ML system design prerequisite dependency map</title>
  <desc id="desc">Five prerequisite branches converge into interview readiness and production decision reasoning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe1e8" stroke-width="1"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#fffdf6"/>
  <rect x="18" y="18" width="1364" height="784" rx="18" fill="none" stroke="#172033" stroke-width="2"/>
  <text x="60" y="78" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800"><tspan x="60" dy="0">PREREQUISITES ARE DEPENDENCIES, NOT A CHECKLIST</tspan></text><text x="60" y="112" text-anchor="start" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="60" dy="0">Each branch answers a different class of interviewer follow-up.</tspan></text><g><rect x="60" y="150" width="220" height="165" rx="14" fill="#dbeafe" stroke="#172033" stroke-width="2" /><text x="170" y="182" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="170" dy="0">Software +</tspan><tspan x="170" dy="25.6">distributed systems</tspan></text><text x="170" y="245.2" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="170" dy="0">APIs · caches · queues</tspan><tspan x="170" dy="19.2">partitioning · deadlines</tspan></text></g><g><rect x="325" y="150" width="220" height="165" rx="14" fill="#dcfce7" stroke="#172033" stroke-width="2" /><text x="435" y="182" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="435" dy="0">Data</tspan><tspan x="435" dy="25.6">engineering</tspan></text><text x="435" y="245.2" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="435" dy="0">batch · streaming</tspan><tspan x="435" dy="19.2">event time · backfills</tspan></text></g><g><rect x="590" y="150" width="220" height="165" rx="14" fill="#ede9fe" stroke="#172033" stroke-width="2" /><text x="700" y="182" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="700" dy="0">Machine learning</tspan><tspan x="700" dy="25.6">fundamentals</tspan></text><text x="700" y="245.2" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="700" dy="0">targets · losses · ranking</tspan><tspan x="700" dy="19.2">calibration · embeddings</tspan></text></g><g><rect x="855" y="150" width="220" height="165" rx="14" fill="#fef3c7" stroke="#172033" stroke-width="2" /><text x="965" y="182" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="965" dy="0">Evaluation +</tspan><tspan x="965" dy="25.6">experimentation</tspan></text><text x="965" y="245.2" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="965" dy="0">temporal splits · slices</tspan><tspan x="965" dy="19.2">shadow · A/B tests</tspan></text></g><g><rect x="1120" y="150" width="220" height="165" rx="14" fill="#fce7f3" stroke="#172033" stroke-width="2" /><text x="1230" y="182" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750"><tspan x="1230" dy="0">Production</tspan><tspan x="1230" dy="25.6">operations</tspan></text><text x="1230" y="245.2" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="1230" dy="0">lineage · rollback · drift</tspan><tspan x="1230" dy="19.2">privacy · cost</tspan></text></g><path d="M170 315 L700 510" fill="none" stroke="#596579" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><path d="M435 315 L700 510" fill="none" stroke="#596579" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><path d="M700 315 L700 510" fill="none" stroke="#596579" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><path d="M965 315 L700 510" fill="none" stroke="#596579" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><path d="M1230 315 L700 510" fill="none" stroke="#596579" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><g><rect x="470" y="510" width="460" height="145" rx="14" fill="#ffedd5" stroke="#172033" stroke-width="2" /><text x="700" y="542" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="750"><tspan x="700" dy="0">ML system design readiness</tspan></text><text x="700" y="589.84" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="700" dy="0">decision → data → model → serving → learning</tspan><tspan x="700" dy="23.04">with explicit trade-offs and failure behavior</tspan></text></g><path d="M700 655 L700 724" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="700" y="760" text-anchor="middle" fill="#b91c1c" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750"><tspan x="700" dy="0">Can you explain what changes the design?</tspan></text>
</svg>
