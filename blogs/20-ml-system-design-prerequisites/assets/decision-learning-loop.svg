<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Decision-to-learning loop</title>
  <desc id="desc">A closed lifecycle connects product decisions to exposure, outcomes, point-in-time data, training, release, and the next decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe1e8" stroke-width="1"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#fffdf6"/>
  <rect x="18" y="18" width="1364" height="784" rx="18" fill="none" stroke="#172033" stroke-width="2"/>
  <text x="55" y="76" text-anchor="start" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800"><tspan x="55" dy="0">THE PRODUCT ACTION CREATES THE NEXT TRAINING DISTRIBUTION</tspan></text><text x="55" y="110" text-anchor="start" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="55" dy="0">Log what was considered, not only what was clicked or approved.</tspan></text><g><rect x="540" y="100" width="320" height="100" rx="14" fill="#fef3c7" stroke="#172033" stroke-width="2" /><text x="700" y="132" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750"><tspan x="700" dy="0">Product decision</tspan></text><text x="700" y="170.88" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="700" dy="0">recipient · deadline · action</tspan></text></g><g><rect x="940" y="230" width="300" height="100" rx="14" fill="#dbeafe" stroke="#172033" stroke-width="2" /><text x="1090" y="262" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750"><tspan x="1090" dy="0">Decision + exposure log</tspan></text><text x="1090" y="300.88" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="1090" dy="0">candidates · versions · action</tspan></text></g><g><rect x="940" y="475" width="300" height="100" rx="14" fill="#fce7f3" stroke="#172033" stroke-width="2" /><text x="1090" y="507" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750"><tspan x="1090" dy="0">Outcomes + labels</tspan></text><text x="1090" y="545.88" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="1090" dy="0">delay · source · confidence</tspan></text></g><g><rect x="540" y="625" width="320" height="100" rx="14" fill="#dcfce7" stroke="#172033" stroke-width="2" /><text x="700" y="657" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750"><tspan x="700" dy="0">Point-in-time dataset</tspan></text><text x="700" y="695.88" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="700" dy="0">features as known at decision</tspan></text></g><g><rect x="150" y="475" width="300" height="100" rx="14" fill="#ede9fe" stroke="#172033" stroke-width="2" /><text x="300" y="507" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750"><tspan x="300" dy="0">Train + evaluate</tspan></text><text x="300" y="545.88" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="300" dy="0">baseline · slices · guardrails</tspan></text></g><g><rect x="150" y="230" width="300" height="100" rx="14" fill="#ffedd5" stroke="#172033" stroke-width="2" /><text x="300" y="262" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750"><tspan x="300" dy="0">Versioned release</tspan></text><text x="300" y="300.88" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="300" dy="0">artifact · policy · rollback</tspan></text></g><path d="M860 150 L940 280" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="900" y="205" text-anchor="middle" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650"><tspan x="900" dy="0">exposes</tspan></text><path d="M1090 330 L1090 475" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text x="1090" y="392.5" text-anchor="middle" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650"><tspan x="1090" dy="0">observes</tspan></text><path d="M940 525 L860 675" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="900" y="590" text-anchor="middle" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650"><tspan x="900" dy="0">joins</tspan></text><path d="M540 675 L450 525" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="495" y="590" text-anchor="middle" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650"><tspan x="495" dy="0">builds</tspan></text><path d="M300 475 L300 330" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="300" y="392.5" text-anchor="middle" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650"><tspan x="300" dy="0">promotes</tspan></text><path d="M450 280 L540 150" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="495" y="205" text-anchor="middle" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650"><tspan x="495" dy="0">serves</tspan></text><g><rect x="515" y="340" width="370" height="135" rx="14" fill="#fffdf6" stroke="#b91c1c" stroke-width="2" stroke-dasharray="9 7"/><text x="700" y="372" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750"><tspan x="700" dy="0">Feedback-loop checkpoint</tspan></text><text x="700" y="413.44" text-anchor="middle" fill="#596579" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="700" dy="0">What outcomes became unobservable</tspan><tspan x="700" dy="20.48">because the current policy acted?</tspan></text></g>
</svg>
