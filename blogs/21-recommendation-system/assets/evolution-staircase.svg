<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc"><title id="title">Recommendation architecture evolution staircase</title><desc id="desc">Three ascending scenarios showing a modular baseline, learned multi-stage recommendation, and globally distributed service architecture with explicit triggers.</desc><defs><style>.bg{fill:#fafaf5}.one{fill:#d9ff63;stroke:#11120f;stroke-width:2}.two{fill:#8da8ff;stroke:#11120f;stroke-width:2}.three{fill:#11120f;stroke:#11120f;stroke-width:2}.note{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 27px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 18px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 18px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.sw{font:500 14px Inter,Arial,sans-serif;fill:#c8cbc2}</style></defs><rect class="bg" width="1600" height="940"/><text class="k" x="55" y="50">EVOLUTION STAIRCASE · ADD A SERVICE ONLY WHEN A MEASURED LIMIT DEMANDS IT</text><path d="M90 790H560V575H1030V350H1510" fill="none" stroke="#11120f" stroke-width="4"/><g transform="translate(110 555)"><rect class="one" width="410" height="215" rx="5"/><text class="h" x="28" y="48">01 · SHIP THE LOOP</text><text class="t" x="28" y="83">Modular feed service</text><text class="s" x="28" y="115">trending · follows · co-watch</text><text class="s" x="28" y="141">GBDT ranker · deterministic slate</text><text class="s" x="28" y="167">daily batch artifacts</text><text class="k" x="28" y="198">100K USERS · 50K ITEMS</text></g><g transform="translate(580 330)"><rect class="two" width="410" height="225" rx="5"/><text class="h" x="28" y="48">02 · LEARN RETRIEVAL</text><text class="t" x="28" y="83">Multi-stage pipeline</text><text class="s" x="28" y="115">two-tower ANN · source blending</text><text class="s" x="28" y="141">pre-ranker · multi-task ranker</text><text class="s" x="28" y="167">streaming session features</text><text class="k" x="28" y="202">10M USERS · 10M ITEMS</text></g><g transform="translate(1050 95)"><rect class="three" width="430" height="235" rx="5"/><text class="tw" x="28" y="48">03 · ISOLATE SCALE</text><text class="tw" x="28" y="83">Regional serving platform</text><text class="sw" x="28" y="115">ANN shards · CPU pre-ranking</text><text class="sw" x="28" y="141">batched GPU rankers · feature KV</text><text class="sw" x="28" y="167">bundle releases · full fallbacks</text><text x="28" y="208" style="font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#d9ff63">1B USERS · BILLION-ITEM CORPUS</text></g><g transform="translate(90 825)"><rect class="note" width="1420" height="75" rx="4"/><text class="t" x="710" y="31" text-anchor="middle">Keep the previous stage alive as baseline and fallback.</text><text class="s" x="710" y="55" text-anchor="middle">Evolution adds a quality or reliability option; it does not erase the simplest system that can still serve.</text></g></svg>
