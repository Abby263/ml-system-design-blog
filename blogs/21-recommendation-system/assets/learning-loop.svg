<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc"><title id="title">Recommendation exposure and learning loop</title><desc id="desc">Circular loop from retrieval and ranking to exposure, user action, event logging, training data, model release, and back to serving, with bias entering at exposure.</desc><defs><style>.bg{fill:#fafaf5}.n{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.dark{fill:#11120f}.a{fill:none;stroke:#11120f;stroke-width:3;marker-end:url(#x)}.bias{fill:none;stroke:#d34b37;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#r)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 17px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 17px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d34b37"/></marker></defs><rect class="bg" width="1500" height="980"/><text class="k" x="55" y="50">LEARNING LOOP · THE MODEL CHOOSES THE DATA THAT TRAINS ITS SUCCESSOR</text><path class="a" d="M750 205C1020 205 1205 330 1235 490"/><path class="a" d="M1235 560C1185 755 985 845 790 835"/><path class="a" d="M700 835C470 835 275 710 260 535"/><path class="a" d="M260 455C305 275 500 195 700 205"/><g transform="translate(610 120)"><rect class="dark" width="280" height="120" rx="5"/><text class="tw" x="140" y="46" text-anchor="middle">Retrieve + rank</text><text x="140" y="76" text-anchor="middle" style="font:500 13px Inter,Arial,sans-serif;fill:#c8cbc2">model bundle + policy</text></g><g transform="translate(1110 430)"><rect class="blue" width="280" height="130" rx="5"/><text class="t" x="140" y="43" text-anchor="middle">Exposure</text><text class="s" x="140" y="72" text-anchor="middle">position · source · propensity</text><text class="s" x="140" y="97" text-anchor="middle">what entered viewport?</text></g><g transform="translate(890 760)"><rect class="lime" width="300" height="130" rx="5"/><text class="t" x="150" y="43" text-anchor="middle">User outcome</text><text class="s" x="150" y="72" text-anchor="middle">watch · skip · like · hide</text><text class="s" x="150" y="97" text-anchor="middle">delayed return behavior</text></g><g transform="translate(310 760)"><rect class="n" width="310" height="130" rx="5"/><text class="t" x="155" y="43" text-anchor="middle">Point-in-time dataset</text><text class="s" x="155" y="72" text-anchor="middle">impressions + outcomes</text><text class="s" x="155" y="97" text-anchor="middle">sampled negatives + slices</text></g><g transform="translate(105 420)"><rect class="blue" width="300" height="130" rx="5"/><text class="t" x="150" y="43" text-anchor="middle">Train + evaluate</text><text class="s" x="150" y="72" text-anchor="middle">offline replay · shadow</text><text class="s" x="150" y="97" text-anchor="middle">canary · A/B · holdout</text></g><g transform="translate(555 390)"><rect class="n" width="390" height="190" rx="95"/><text class="t" x="195" y="57" text-anchor="middle">BIAS ENTERS HERE</text><text class="s" x="195" y="91" text-anchor="middle">unshown items collect no labels</text><text class="s" x="195" y="118" text-anchor="middle">top positions collect more clicks</text><text class="s" x="195" y="145" text-anchor="middle">popular items gain future exposure</text></g><path class="bias" d="M1110 495H950"/><path class="bias" d="M555 495H405"/><text x="750" y="650" text-anchor="middle" style="font:700 14px ui-monospace,monospace;fill:#d34b37">LOG EXPOSURE · CONTROLLED EXPLORATION · PROPENSITY · STABLE HOLDOUT</text></svg>
