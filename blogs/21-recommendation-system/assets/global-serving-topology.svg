<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Global recommendation serving topology</title><desc id="desc">Global routing to regional recommendation cells, each with orchestrator, candidate retrieval, feature store, CPU pre-ranking, GPU ranking, caches, and regional model bundles, plus a separate control plane.</desc><defs><style>.bg{fill:#fafaf5}.region{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.n{fill:#fafaf5;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.dark{fill:#11120f}.a{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#x)}.cfg{fill:none;stroke:#4e62a8;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#q)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 15px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 15px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 12px Inter,Arial,sans-serif;fill:#55584f}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs><rect class="bg" width="1600" height="1000"/><text class="k" x="50" y="48">GLOBAL TOPOLOGY · REGION-LOCAL DATA PATH, VERSIONED CONTROL PLANE</text><g transform="translate(580 75)"><rect class="dark" width="440" height="85" rx="5"/><text class="tw" x="220" y="36" text-anchor="middle">Global edge + region router</text><text x="220" y="61" text-anchor="middle" style="font:500 12px Inter,Arial,sans-serif;fill:#c8cbc2">residency · home region · health · affinity</text></g><path class="a" d="M700 160L420 225M900 160L1180 225"/><g transform="translate(55 220)"><rect class="region" width="720" height="520" rx="6"/><text class="k" x="25" y="38">REGIONAL CELL · AMERICAS</text><g transform="translate(35 75)"><rect class="dark" width="190" height="90" rx="4"/><text class="tw" x="95" y="38" text-anchor="middle">Feed orchestrator</text><text class="s" x="95" y="62" text-anchor="middle" fill="#c8cbc2">deadline + fallback</text></g><g transform="translate(280 65)"><rect class="blue" width="180" height="110" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Candidate fleet</text><text class="s" x="90" y="66" text-anchor="middle">ANN shards</text><text class="s" x="90" y="88" text-anchor="middle">graph · trending</text></g><g transform="translate(515 65)"><rect class="lime" width="170" height="110" rx="4"/><text class="t" x="85" y="38" text-anchor="middle">Feature KV</text><text class="s" x="85" y="66" text-anchor="middle">user · item</text><text class="s" x="85" y="88" text-anchor="middle">session stream</text></g><g transform="translate(85 250)"><rect class="blue" width="190" height="100" rx="4"/><text class="t" x="95" y="39" text-anchor="middle">CPU pre-rank</text><text class="s" x="95" y="65" text-anchor="middle">wide cheap batches</text></g><g transform="translate(325 250)"><rect class="dark" width="190" height="100" rx="4"/><text class="tw" x="95" y="39" text-anchor="middle">GPU rank pool</text><text class="s" x="95" y="65" text-anchor="middle" fill="#c8cbc2">dynamic batching</text></g><g transform="translate(565 250)"><rect class="n" width="120" height="100" rx="4"/><text class="t" x="60" y="39" text-anchor="middle">Cache</text><text class="s" x="60" y="65" text-anchor="middle">fallback</text></g><rect class="n" x="85" y="410" width="550" height="65" rx="4"/><text class="t" x="360" y="438" text-anchor="middle">Regional model bundle + ANN generations</text><text class="s" x="360" y="460" text-anchor="middle">last-known-good remains loaded during control-plane outage</text><path class="a" d="M225 120H280M460 120H515M130 165V250M370 175V250M600 175V250M275 300H325M515 300H565"/></g><g transform="translate(825 220)"><rect class="region" width="720" height="520" rx="6"/><text class="k" x="25" y="38">REGIONAL CELL · EUROPE</text><g transform="translate(35 75)"><rect class="dark" width="190" height="90" rx="4"/><text class="tw" x="95" y="38" text-anchor="middle">Feed orchestrator</text><text class="s" x="95" y="62" text-anchor="middle" fill="#c8cbc2">deadline + fallback</text></g><g transform="translate(280 65)"><rect class="blue" width="180" height="110" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Candidate fleet</text><text class="s" x="90" y="66" text-anchor="middle">ANN shards</text><text class="s" x="90" y="88" text-anchor="middle">graph · trending</text></g><g transform="translate(515 65)"><rect class="lime" width="170" height="110" rx="4"/><text class="t" x="85" y="38" text-anchor="middle">Feature KV</text><text class="s" x="85" y="66" text-anchor="middle">region-resident</text><text class="s" x="85" y="88" text-anchor="middle">session stream</text></g><g transform="translate(85 250)"><rect class="blue" width="190" height="100" rx="4"/><text class="t" x="95" y="39" text-anchor="middle">CPU pre-rank</text><text class="s" x="95" y="65" text-anchor="middle">wide cheap batches</text></g><g transform="translate(325 250)"><rect class="dark" width="190" height="100" rx="4"/><text class="tw" x="95" y="39" text-anchor="middle">GPU rank pool</text><text class="s" x="95" y="65" text-anchor="middle" fill="#c8cbc2">dynamic batching</text></g><g transform="translate(565 250)"><rect class="n" width="120" height="100" rx="4"/><text class="t" x="60" y="39" text-anchor="middle">Cache</text><text class="s" x="60" y="65" text-anchor="middle">fallback</text></g><rect class="n" x="85" y="410" width="550" height="65" rx="4"/><text class="t" x="360" y="438" text-anchor="middle">Regional model bundle + ANN generations</text><text class="s" x="360" y="460" text-anchor="middle">independently canaried; compatibility pinned</text><path class="a" d="M225 120H280M460 120H515M130 165V250M370 175V250M600 175V250M275 300H325M515 300H565"/></g><g transform="translate(270 820)"><rect class="n" width="1060" height="120" rx="5"/><text class="k" x="25" y="35">GLOBAL CONTROL + OFFLINE PLANE · NOT IN REQUEST PATH</text><text class="t" x="530" y="66" text-anchor="middle">event lake · training pipelines · registry · evaluation · experiment policy · bundle rollout</text><text class="s" x="530" y="92" text-anchor="middle">publish immutable bundles; cells pull, validate, warm, canary, and retain rollback</text></g><path class="cfg" d="M520 820V765H415V700"/><path class="cfg" d="M1080 820V765H1185V700"/></svg>
