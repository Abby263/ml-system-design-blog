<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Recommendation decision funnel</title><desc id="desc">A tapered recommendation funnel narrowing billions of eligible items through retrieval, pre-ranking, heavy ranking, and slate optimization to twenty results.</desc><defs><style>.bg{fill:#fafaf5}.dark{fill:#11120f}.blue{fill:#8da8ff}.lime{fill:#d9ff63}.gray{fill:#dcded6}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 32px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 20px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 20px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 14px Inter,Arial,sans-serif;fill:#55584f}.n{font:800 42px Inter,Arial,sans-serif;fill:#11120f}.nw{font:800 42px Inter,Arial,sans-serif;fill:#fafaf5}</style></defs><rect class="bg" width="1600" height="1120"/><text class="k" x="55" y="50">DECISION FUNNEL · EACH STAGE OPTIMIZES A DIFFERENT JOB</text><text class="h" x="55" y="100">Do not ask one model to search, score, and compose.</text><g transform="translate(100 160)"><path class="gray" d="M0 0H1400L1275 150H125Z"/><text class="n" x="700" y="70" text-anchor="middle">1B eligible items</text><text class="t" x="700" y="110" text-anchor="middle">policy + availability boundary</text><path class="blue" d="M125 165H1275L1160 325H240Z"/><text class="n" x="700" y="240" text-anchor="middle">5,000 candidates</text><text class="t" x="700" y="282" text-anchor="middle">parallel retrieval · optimize Recall@K</text><path class="lime" d="M240 340H1160L1045 500H355Z"/><text class="n" x="700" y="415" text-anchor="middle">1,000 pre-ranked</text><text class="t" x="700" y="457" text-anchor="middle">cheap CPU scoring · protect expensive compute</text><path class="dark" d="M355 515H1045L925 675H475Z"/><text class="nw" x="700" y="590" text-anchor="middle">200 heavy-ranked</text><text class="tw" x="700" y="632" text-anchor="middle">rich cross features · multi-task precision</text><path class="blue" d="M475 690H925L820 835H580Z"/><text class="n" x="700" y="757" text-anchor="middle">20-item slate</text><text class="t" x="700" y="798" text-anchor="middle">diversity · freshness · exploration · hard constraints</text></g><text class="s" x="800" y="1080" text-anchor="middle">An item lost upstream cannot be rescued by a better downstream ranker.</text></svg>
