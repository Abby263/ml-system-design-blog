<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc"><title id="title">Recommendation request latency waterfall</title><desc id="desc">A two hundred millisecond request timeline showing parallel candidate retrieval, feature fetch, pre-ranking, heavy ranking, slate composition, and contingency.</desc><defs><style>.bg{fill:#fafaf5}.axis{stroke:#777a70;stroke-width:1.5}.grid{stroke:#d4d6ce;stroke-width:1}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.dark{fill:#11120f}.gray{fill:#e7e8e1;stroke:#11120f;stroke-width:2}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.t{font:700 15px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 15px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 13px Inter,Arial,sans-serif;fill:#55584f}</style></defs><rect class="bg" width="1500" height="880"/><text class="k" x="55" y="48">P99 LATENCY WATERFALL · ONE DEADLINE, PARALLEL SOURCES, BATCHED INFERENCE</text><line class="axis" x1="300" y1="120" x2="1420" y2="120"/><g class="grid"><path d="M300 105V810M580 105V810M860 105V810M1140 105V810M1420 105V810"/></g><g class="k"><text x="300" y="92">0 MS</text><text x="565" y="92">50</text><text x="840" y="92">100</text><text x="1115" y="92">150</text><text x="1390" y="92">200</text></g><g class="t"><text x="55" y="175">Gateway + context</text><text x="55" y="255">ANN retrieval</text><text x="55" y="325">Graph / co-watch</text><text x="55" y="395">Trending + follows</text><text x="55" y="485">Merge + policy filter</text><text x="55" y="565">Pre-rank + features</text><text x="55" y="645">Heavy rank (batch)</text><text x="55" y="725">Slate + serialize</text><text x="55" y="805">Contingency</text></g><rect class="gray" x="300" y="145" width="84" height="45" rx="4"/><text class="s" x="342" y="174" text-anchor="middle">15 ms</text><rect class="blue" x="384" y="225" width="252" height="45" rx="4"/><text class="t" x="510" y="254" text-anchor="middle">45 ms</text><rect class="blue" x="384" y="295" width="224" height="45" rx="4"/><text class="t" x="496" y="324" text-anchor="middle">40 ms</text><rect class="blue" x="384" y="365" width="112" height="45" rx="4"/><text class="t" x="440" y="394" text-anchor="middle">20 ms</text><rect class="lime" x="636" y="455" width="112" height="45" rx="4"/><text class="t" x="692" y="484" text-anchor="middle">20 ms</text><rect class="lime" x="748" y="535" width="252" height="45" rx="4"/><text class="t" x="874" y="564" text-anchor="middle">45 ms</text><rect class="dark" x="1000" y="615" width="308" height="45" rx="4"/><text class="tw" x="1154" y="644" text-anchor="middle">55 ms</text><rect class="blue" x="1308" y="695" width="112" height="45" rx="4"/><text class="t" x="1364" y="724" text-anchor="middle">20 ms</text><rect class="gray" x="1308" y="775" width="112" height="45" rx="4"/><text class="t" x="1364" y="804" text-anchor="middle">20 ms</text><text class="s" x="300" y="855">Slow source? Deadline expires and the orchestrator continues with partial candidates. Never serialize independent retrieval calls.</text></svg>
