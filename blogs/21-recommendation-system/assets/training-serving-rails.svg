<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Recommendation training and serving rails</title><desc id="desc">Parallel offline training and online serving rails joined by a versioned model bundle and exposure event feedback.</desc><defs><style>.bg{fill:#fafaf5}.rail{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.n{fill:#fafaf5;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.dark{fill:#11120f}.a{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#x)}.feedback{fill:none;stroke:#4e62a8;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#q)}.k{font:700 13px ui-monospace,monospace;letter-spacing:1.5px;fill:#777a70}.h{font:700 24px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 15px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 15px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 12px Inter,Arial,sans-serif;fill:#55584f}</style><marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker><marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4e62a8"/></marker></defs><rect class="bg" width="1600" height="1050"/><text class="k" x="50" y="48">DUAL RAILS · IMMUTABLE ARTIFACTS CROSS FROM TRAINING INTO SERVING</text><g transform="translate(50 85)"><rect class="rail" width="1500" height="360" rx="5"/><text class="k" x="25" y="38">OFFLINE TRAINING RAIL</text><path class="a" d="M205 190H275M455 190H525M705 190H775M955 190H1025M1205 190H1275"/><g transform="translate(35 140)"><rect class="n" width="170" height="100" rx="4"/><text class="t" x="85" y="39" text-anchor="middle">Event lake</text><text class="s" x="85" y="64" text-anchor="middle">impressions + outcomes</text></g><g transform="translate(275 125)"><rect class="blue" width="180" height="130" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Point-in-time</text><text class="t" x="90" y="59" text-anchor="middle">dataset</text><text class="s" x="90" y="87" text-anchor="middle">features + labels</text></g><g transform="translate(525 125)"><rect class="dark" width="180" height="130" rx="4"/><text class="tw" x="90" y="39" text-anchor="middle">Train models</text><text class="s" x="90" y="67" text-anchor="middle" fill="#c8cbc2">retrieval · pre-rank</text><text class="s" x="90" y="91" text-anchor="middle" fill="#c8cbc2">multi-task ranker</text></g><g transform="translate(775 125)"><rect class="lime" width="180" height="130" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Evaluate</text><text class="s" x="90" y="67" text-anchor="middle">quality · slices</text><text class="s" x="90" y="91" text-anchor="middle">latency · cost</text></g><g transform="translate(1025 125)"><rect class="blue" width="180" height="130" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Build index</text><text class="s" x="90" y="67" text-anchor="middle">item tower version</text><text class="s" x="90" y="91" text-anchor="middle">ANN recall report</text></g><g transform="translate(1275 115)"><rect class="dark" width="190" height="150" rx="4"/><text class="tw" x="95" y="37" text-anchor="middle">Bundle manifest</text><text class="s" x="95" y="66" text-anchor="middle" fill="#c8cbc2">models · index</text><text class="s" x="95" y="90" text-anchor="middle" fill="#c8cbc2">features · policy</text><text class="s" x="95" y="114" text-anchor="middle" fill="#c8cbc2">checksums + fallback</text></g></g><g transform="translate(50 535)"><rect class="rail" width="1500" height="360" rx="5"/><text class="k" x="25" y="38">ONLINE SERVING RAIL</text><path class="a" d="M200 190H270M450 190H520M700 190H770M950 190H1020M1200 190H1270"/><g transform="translate(35 140)"><rect class="n" width="165" height="100" rx="4"/><text class="t" x="83" y="39" text-anchor="middle">Feed request</text><text class="s" x="83" y="64" text-anchor="middle">user + session</text></g><g transform="translate(270 125)"><rect class="blue" width="180" height="130" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Retrieve</text><text class="s" x="90" y="67" text-anchor="middle">query tower + ANN</text><text class="s" x="90" y="91" text-anchor="middle">parallel sources</text></g><g transform="translate(520 125)"><rect class="lime" width="180" height="130" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Pre-rank</text><text class="s" x="90" y="67" text-anchor="middle">cheap CPU batch</text><text class="s" x="90" y="91" text-anchor="middle">5K → 1K</text></g><g transform="translate(770 125)"><rect class="dark" width="180" height="130" rx="4"/><text class="tw" x="90" y="38" text-anchor="middle">Heavy rank</text><text class="s" x="90" y="67" text-anchor="middle" fill="#c8cbc2">shared context</text><text class="s" x="90" y="91" text-anchor="middle" fill="#c8cbc2">batched candidates</text></g><g transform="translate(1020 125)"><rect class="blue" width="180" height="130" rx="4"/><text class="t" x="90" y="38" text-anchor="middle">Compose slate</text><text class="s" x="90" y="67" text-anchor="middle">constraints + diversity</text><text class="s" x="90" y="91" text-anchor="middle">200 → 20</text></g><g transform="translate(1270 125)"><rect class="n" width="195" height="130" rx="4"/><text class="t" x="98" y="38" text-anchor="middle">Response + log</text><text class="s" x="98" y="67" text-anchor="middle">request/model versions</text><text class="s" x="98" y="91" text-anchor="middle">candidate exposure</text></g></g><path class="a" d="M1420 350V500H910V660"/><text class="k" x="1110" y="485">PROMOTE VERSIONED BUNDLE</text><path class="feedback" d="M1420 790V980H135V305"/><text class="k" x="565" y="1010" fill="#4e62a8">DURABLE EXPOSURE + OUTCOMES RETURN TO THE EVENT LAKE</text></svg>
