<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Low-level component contracts for the feed orchestrator</title>
  <desc id="desc">FeedOrchestrator calls several CandidateSource implementations in parallel, hands the merged candidates to a Ranker, then to a SlatePolicy that composes the final slate and emits an exposure event.</desc>
  <defs>
    <style>
      .bg{fill:#fafaf5}.group{fill:#f0f0e9;stroke:#11120f;stroke-width:2}.node{fill:#fafaf5;stroke:#11120f;stroke-width:2}.blue{fill:#8da8ff;stroke:#11120f;stroke-width:2}.lime{fill:#d9ff63;stroke:#11120f;stroke-width:2}.dark{fill:#11120f;stroke:#11120f;stroke-width:2}.arrow{fill:none;stroke:#11120f;stroke-width:2.5;marker-end:url(#arrow)}
      .k{font:700 12px ui-monospace,monospace;letter-spacing:1.4px;fill:#777a70}.h{font:700 22px Inter,Arial,sans-serif;fill:#11120f}.t{font:700 15px Inter,Arial,sans-serif;fill:#11120f}.tw{font:700 15px Inter,Arial,sans-serif;fill:#fafaf5}.s{font:500 11px ui-monospace,monospace;fill:#55584f}.sw{font:500 11px ui-monospace,monospace;fill:#c8cbc2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#11120f"/></marker>
  </defs>
  <rect class="bg" width="1500" height="760"/>
  <text class="k" x="50" y="42">LLD · COMPONENT CONTRACTS</text>
  <text class="h" x="50" y="76">Three narrow interfaces the orchestrator depends on, nothing more.</text>

  <g transform="translate(50 150)"><rect class="dark" width="260" height="90" rx="5"/><text class="tw" x="130" y="36" text-anchor="middle">FeedOrchestrator</text><text class="sw" x="130" y="60" text-anchor="middle">Serve(context, deadline)</text><text class="sw" x="130" y="76" text-anchor="middle">-&gt; Response</text></g>

  <text class="s" x="335" y="98">parallel · per-source timeout</text>
  <g transform="translate(430 110)"><rect class="node" width="270" height="90" rx="5"/><text class="t" x="135" y="34" text-anchor="middle">CandidateSource</text><text class="s" x="135" y="58" text-anchor="middle">retrieve(context, limit)</text><text class="s" x="135" y="76" text-anchor="middle">-&gt; Candidate[]</text></g>
  <g transform="translate(430 220)"><rect class="node" width="270" height="90" rx="5"/><text class="t" x="135" y="34" text-anchor="middle">CandidateSource</text><text class="s" x="135" y="58" text-anchor="middle">(trending, co-watch, ANN, ...)</text><text class="s" x="135" y="76" text-anchor="middle">-&gt; Candidate[]</text></g>
  <g transform="translate(430 330)"><rect class="blue" width="270" height="90" rx="5"/><text class="t" x="135" y="34" text-anchor="middle">Ranker</text><text class="s" x="135" y="58" text-anchor="middle">score(context, candidates)</text><text class="s" x="135" y="76" text-anchor="middle">-&gt; Score[]</text></g>

  <path class="arrow" d="M310 195 430 155"/>
  <path class="arrow" d="M310 195 430 265"/>
  <path class="arrow" d="M310 195 430 375"/>

  <g transform="translate(800 220)"><rect class="lime" width="280" height="90" rx="5"/><text class="t" x="140" y="34" text-anchor="middle">SlatePolicy</text><text class="s" x="140" y="58" text-anchor="middle">compose(ranked, size)</text><text class="s" x="140" y="76" text-anchor="middle">-&gt; Candidate[]</text></g>
  <path class="arrow" d="M700 155 800 250"/>
  <path class="arrow" d="M700 265H800"/>
  <path class="arrow" d="M700 375 800 290"/>

  <g transform="translate(1160 220)"><rect class="dark" width="290" height="90" rx="5"/><text class="tw" x="145" y="34" text-anchor="middle">Exposure log</text><text class="sw" x="145" y="58" text-anchor="middle">emit(response, candidates)</text><text class="sw" x="145" y="76" text-anchor="middle">-&gt; durable event</text></g>
  <path class="arrow" d="M1080 265H1160"/>

  <rect class="group" x="50" y="470" width="1400" height="250" rx="6"/>
  <text class="k" x="74" y="505">INVARIANTS THIS SEAM PROTECTS</text>
  <text class="t" x="74" y="540">Every candidate carries source provenance, retrieval score, and eligibility state</text>
  <text class="s" x="74" y="562">— so a bad slate can be traced back to which source, which score, and which filter let it through.</text>
  <text class="t" x="74" y="598">SlatePolicy is the only stage that sees the whole list at once</text>
  <text class="s" x="74" y="620">— hard constraints and diversity trade-offs live here, never inside a per-item Ranker score.</text>
  <text class="t" x="74" y="656">The response carries request, model, and policy versions</text>
  <text class="s" x="74" y="678">— this is what lets the companion implementation swap retrievers, compare rankers, and replay a bad slate later.</text>
</svg>
